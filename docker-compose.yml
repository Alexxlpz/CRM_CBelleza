# Los datos sensibles (contraseñas, correo, claves) se leen del fichero .env de esta carpeta,
# que NO se sube a git. Para crearlo: copia .env.example a .env y rellénalo.
# Si falta una variable obligatoria, "docker compose up" se detiene con un mensaje.
# Logs con tope: como mucho 5 ficheros de 10 MB por contenedor, para que nunca llenen el disco del servidor
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_cbelleza_app
    # Solo en el propio servidor (127.0.0.1): a internet se sale por Cloudflare (el servicio cloudflared de abajo).
    # Abierto a todas las interfaces, cualquiera podría saltarse Cloudflare, ir por http:// e inventarse su IP.
    # Para probar desde otro equipo de casa: APP_BIND=0.0.0.0 en el .env (y nunca con FORWARD_HEADERS_STRATEGY=native).
    ports:
      - "${APP_BIND:-127.0.0.1}:8080:8080"
    environment:
      # Perfil de producción (application-prod.properties): no arranca si falta algo imprescindible en el .env
      # (ProductionChecks). Para probar en local por http://, pon SPRING_PROFILES_ACTIVE= (vacío) en el .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-prod}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      H2_CONSOLE_ENABLED: "false"
      # Correo (vacío = los correos se escriben en la consola en lugar de enviarse)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CRM_ADMIN_EMAIL: ${CRM_ADMIN_EMAIL:-cuquora@hotmail.com}
      CRM_FROM_EMAIL: ${CRM_FROM_EMAIL:-cuquora@hotmail.com}
      # Clave fija para que «Recordar mi sesión» siga funcionando tras reiniciar el contenedor
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?Falta REMEMBER_ME_KEY en .env}
      # Obligatoria: con ella se escriben los enlaces de los correos (invitaciones, publicar un centro). Vacía, la app
      # los tomaría de la cabecera Host de la petición, que la elige quien la envía.
      SITE_URL: ${SITE_URL:?Falta SITE_URL en .env (p. ej. https://cuquora.com o http://localhost:8080)}
      # Con HTTPS delante (Cloudflare) se quedan en true / native. Solo para probar en local por http://: false / none.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
      # Zona horaria del servidor (hora de las citas, «ahora» al reservar y al completar citas)
      TZ: ${TZ:-Europe/Madrid}
      # Titular de la web en Términos y Privacidad (LSSI)
      LEGAL_OWNER_NAME: ${LEGAL_OWNER_NAME:-}
      LEGAL_OWNER_NIF: ${LEGAL_OWNER_NIF:-}
      LEGAL_OWNER_ADDRESS: ${LEGAL_OWNER_ADDRESS:-}
      # Iniciar sesión con Google (opcional: vacías = sin botón de Google)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Cifra los tokens de Google Calendar guardados (opcional: vacía = sin sincronización)
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      # Cuentas demo con contraseña pública: solo "true" en una instalación de pruebas
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Una base de datos creada antes de Flyway (con el antiguo init.sql) se marca como versión 1
      # en lugar de fallar; en un volumen nuevo las migraciones se ejecutan desde cero.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # API de productos propia (servicio product-api de abajo): datos y foto de un producto por su código de barras
      PRODUCT_API_URL: http://product-api:8081
      PRODUCT_API_KEY: ${PRODUCT_API_KEY:?Falta PRODUCT_API_KEY en .env}
    depends_on:
      db:
        condition: service_healthy
      product-api:
        condition: service_started
    # «docker compose ps» dice si está sana. Ojo: Docker solo la marca como «unhealthy», no la reinicia; restart la
    # vuelve a arrancar si el proceso se cae.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: crm_cbelleza_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    # Sin "ports": PostgreSQL solo es accesible desde la app, dentro de la red de Docker.
    # Para conectarte desde tu equipo (DBeaver, IntelliJ...) durante el desarrollo, descomenta
    # estas dos líneas: lo publica solo en localhost, nunca hacia fuera.
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *logs
    restart: unless-stopped

  # Prepara el usuario propio de la API de productos (productos_api), dueño solo del esquema «productos» y sin
  # permisos sobre las tablas de Cuquora. Se ejecuta en cada «up», tarda un segundo y se para (docker/postgres/db-setup.sh).
  db-setup:
    image: postgres:16-alpine
    container_name: crm_cbelleza_db_setup
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      PRODUCT_API_DB_PASSWORD: ${PRODUCT_API_DB_PASSWORD:?Falta PRODUCT_API_DB_PASSWORD en .env}
    volumes:
      - ./docker/postgres/db-setup.sh:/db-setup.sh:ro
    entrypoint: ["sh", "/db-setup.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logs
    restart: "no"

  # API de productos por código de barras (carpeta product-api/). Solo la usa la app, por la red interna de Docker
  # y con la clave PRODUCT_API_KEY: sin "ports", no se puede llegar a ella desde fuera.
  # Guarda los productos en la misma base de datos, en su propio esquema «productos» (entra en la copia de seguridad),
  # con su propio usuario (productos_api, lo prepara db-setup): no puede ver las tablas de Cuquora.
  # Si un código no lo conoce, lo busca en Open Beauty Facts: necesita salida a world.openbeautyfacts.org
  # e images.openbeautyfacts.org. Si se cae, la app sigue funcionando y los productos se rellenan a mano.
  product-api:
    build:
      context: ./product-api
      dockerfile: Dockerfile
    container_name: crm_cbelleza_product_api
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DB_USERNAME: productos_api
      DB_PASSWORD: ${PRODUCT_API_DB_PASSWORD:?Falta PRODUCT_API_DB_PASSWORD en .env}
      PRODUCT_API_KEY: ${PRODUCT_API_KEY:?Falta PRODUCT_API_KEY en .env}
      OPEN_BEAUTY_FACTS_ENABLED: ${OPEN_BEAUTY_FACTS_ENABLED:-true}
      TZ: ${TZ:-Europe/Madrid}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logs
    restart: unless-stopped

  # Cloudflare Tunnel: publica la app en https://cuquora.com sin abrir ningún puerto del servidor ni del router.
  # cloudflared sale hacia Cloudflare y le reenvía las visitas a http://app:8080 por la red interna de Docker.
  # El túnel y su dominio se configuran en Cloudflare (Zero Trust > Networks > Tunnels); aquí solo va su token.
  # Solo arranca con COMPOSE_PROFILES=cloudflare en el .env (en el servidor), así en local no hace falta token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crm_cbelleza_tunnel
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    logging: *logs
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/docker-storage/cuquora/postgres
