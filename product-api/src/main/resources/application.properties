spring.application.name=cuquora-product-api
server.port=8081

# Misma base de datos PostgreSQL que Cuquora, pero en su propio esquema «productos»: no toca las tablas de la app
# y entra en la copia diaria (docker/backup-db.sh). Sin DB_URL (en local) usa una base H2 en memoria.
spring.datasource.url=${DB_URL:jdbc:h2:mem:productos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.schemas=productos
spring.flyway.default-schema=productos
spring.jpa.properties.hibernate.default_schema=productos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Si la base de datos no está, falla en 3 segundos en lugar de 30: así el healthcheck de Docker la ve caída a tiempo
spring.datasource.hikari.connection-timeout=3000

# Clave que tiene que mandar Cuquora en la cabecera X-Api-Key. Sin ella (o con menos de 32 caracteres) no arranca.
product-api.key=${PRODUCT_API_KEY:}
# Si un código no está aquí, se busca en Open Beauty Facts y se guarda (false = solo lo que aportan los centros)
product-api.open-beauty-facts=${OPEN_BEAUTY_FACTS_ENABLED:true}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
spring.web.error.include-message=always
