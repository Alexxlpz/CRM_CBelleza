<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Crear Cuenta - Cuquora CRM')}"></th:block>
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/form-validation.js" defer></script>
</head>
<body class="auth-page">
    <div th:replace="~{fragments/navbar :: brand(false)}"></div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Crear cuenta</h1>
                <p>Únete a Cuquora para reservar citas y disfrutar de tratamientos exclusivos</p>
            </div>

            <div class="alert alert-error" role="alert" th:if="${errorMessage != null}">
                <i class="lucide-alert-circle" aria-hidden="true"></i>
                <span th:text="${errorMessage}">Ha ocurrido un error al crear tu cuenta.</span>
            </div>

            <form th:action="@{/register}" method="post" id="registerForm" autocomplete="on" novalidate>
                <div class="form-group">
                    <label for="nameInput" class="form-label">Nombre y apellidos</label>
                    <input type="text" id="nameInput" name="name" class="form-control" autofocus
                           autocomplete="name" placeholder="Ej. Laura Gómez" th:value="${name}">
                </div>

                <div class="form-group">
                    <label for="emailInput" class="form-label">Correo electrónico</label>
                    <input type="email" id="emailInput" name="email" class="form-control"
                           autocomplete="email" placeholder="ejemplo@cbelleza.com" th:value="${email}">
                </div>

                <div class="form-group">
                    <label for="phoneInput" class="form-label">Teléfono de contacto <span class="form-label-hint">(opcional)</span></label>
                    <input type="tel" id="phoneInput" name="phone" class="form-control"
                           autocomplete="tel" placeholder="+34 600 000 000" th:value="${phone}">
                </div>

                <div class="form-group">
                    <label for="passwordInput" class="form-label">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" name="password" class="form-control"
                               autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6">
                        <button type="button" class="password-toggle-btn" data-toggle-password="passwordInput"
                                aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
                            <i class="lucide-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPasswordInput" class="form-label">Confirmar contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPasswordInput" name="confirmPassword" class="form-control"
                               autocomplete="new-password" placeholder="Repite tu contraseña" minlength="6">
                        <button type="button" class="password-toggle-btn" data-toggle-password="confirmPasswordInput"
                                aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
                            <i class="lucide-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg disabled" id="submitBtn" aria-disabled="true">
                    <i class="lucide-user-plus" aria-hidden="true"></i>
                    <span>Crear mi cuenta</span>
                </button>
            </form>

            <div class="auth-divider"><span>¿Ya tienes cuenta?</span></div>

            <a href="/login" class="btn btn-secondary btn-block btn-lg">
                <i class="lucide-log-in" aria-hidden="true"></i>
                <span>Iniciar sesión con mi cuenta</span>
            </a>

            <div class="auth-trust-row">
                <span><i class="lucide-shield-check" aria-hidden="true"></i> Conexión segura</span>
                <span><i class="lucide-check" aria-hidden="true"></i> Privacidad RGPD garantizada</span>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética.')}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const V = Cuquora.validators;
            Cuquora.validateForm(document.getElementById('registerForm'), {
                name: [V.required('Por favor, introduce tu nombre y apellidos.'), V.minLength(2, 'El nombre debe tener al menos 2 caracteres.')],
                email: [V.required('Por favor, introduce tu correo electrónico.'), V.email()],
                phone: [V.phone()],
                password: [V.required('Por favor, introduce una contraseña.'), V.minLength(6, 'La contraseña debe tener al menos 6 caracteres.')],
                confirmPassword: [V.required('Por favor, confirma tu contraseña.'), V.sameAs('password', 'Las contraseñas no coinciden. Por favor, revísalas.')]
            });
        });
    </script>
</body>
</html>
