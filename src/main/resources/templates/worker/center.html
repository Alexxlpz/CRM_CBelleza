<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta(${sectionTitle + ' · Mi Centro - Cuquora CRM'})}"></th:block>
    <!--/* Cada apartado carga solo su JS: el mapa (Leaflet) solo hace falta en Centro */-->
    <th:block th:if="${section == 'centro'}">
        <!-- Leaflet 1.9.4 servido por la propia web (static/vendor/leaflet): un CDN comprometido no puede meter código aquí -->
        <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}">
        <script th:src="@{/vendor/leaflet/leaflet.js}" defer></script>
        <script th:src="@{/js/location-picker.js}" defer></script>
        <script th:src="@{/js/phone-input.js}" defer></script>
        <script th:src="@{/js/opening-hours.js}" defer></script>
    </th:block>
    <script th:if="${section == 'reservas'}" th:src="@{/js/loyalty-settings.js}" defer></script>
    <script th:if="${section == 'centro' or section == 'cuenta'}" th:src="@{/js/photo-picker.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel', ${notifications})}"></div>

    <!--/* is-index: /worker/center. En el móvil enseña solo la lista de apartados; en un apartado, solo su contenido */-->
    <main class="main-container settings-page settings-page--split center-settings" th:classappend="${isIndex} ? 'is-index'">
        <header class="page-header page-header--panel">
            <span th:replace="~{worker/fragments/page-header :: icon('store')}"></span>
            <div class="page-header-text">
                <th:block th:if="${isIndex}"><nav th:replace="~{worker/fragments/page-header :: crumb('Mi Centro')}"></nav></th:block>
                <th:block th:unless="${isIndex}"><nav th:replace="~{worker/fragments/page-header :: subcrumb('Mi Centro', '/worker/center', ${sectionTitle})}"></nav></th:block>
                <h1 th:text="${center.name}">Mi Centro</h1>
                <p th:text="${isOwner} ? 'Los datos de tu centro, cómo reservan tus clientes, tu equipo y tu cuenta' : 'Tu cuenta y el enlace para que tus clientes reserven'">Los datos de tu centro, cómo reservan tus clientes, tu equipo y tu cuenta</p>
            </div>
        </header>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <div class="alert alert-warning" role="status" th:unless="${center.published}">
            <i class="lucide-hourglass" aria-hidden="true"></i>
            <span>Estamos revisando tu centro: todavía no sale en el buscador ni en el mapa. Mientras tanto, prepara tratamientos y precios para que los clientes puedan reservar desde el primer día.</span>
        </div>

        <th:block th:if="${isIndex and !isOwner}">
            <div th:replace="~{fragments/alerts :: ownerOnly(${'Los datos, el horario, el equipo y la configuración del centro los gestiona ' + ownerName + ', dueño del centro.'})}"></div>
        </th:block>

        <div class="center-settings-layout">
            <nav class="center-settings-nav" aria-label="Apartados de Mi Centro">
                <!--/* Al dueño, en el orden del alta; al resto, primero lo que puede cambiar */-->
                <th:block th:if="${isOwner}">
                    <a th:replace="~{worker/fragments/center-sections :: navItem('centro', 'store', 'Centro', 'Datos, ubicación, horario y foto')}"></a>
                    <a th:replace="~{worker/fragments/center-sections :: navItem('reservas', 'calendar-plus', 'Reservas', 'Reservas automáticas, enlace, cartel y tarjeta de puntos')}"></a>
                    <a th:replace="~{worker/fragments/center-sections :: navItem('equipo', 'users', 'Equipo', 'Personas, invitaciones y dueño del centro')}"></a>
                    <a th:replace="~{worker/fragments/center-sections :: navItem('cuenta', 'user-cog', 'Mi cuenta', 'Tus datos, contraseña, foto y Google Calendar')}"></a>
                </th:block>
                <th:block th:unless="${isOwner}">
                    <a th:replace="~{worker/fragments/center-sections :: navItem('cuenta', 'user-cog', 'Mi cuenta', 'Tus datos, contraseña, foto y Google Calendar')}"></a>
                    <a th:replace="~{worker/fragments/center-sections :: navItem('reservas', 'calendar-plus', 'Reservas', 'Enlace para reservar y cartel con QR')}"></a>
                </th:block>
            </nav>

            <div class="center-settings-content">
                <a class="center-settings-back" th:href="@{/worker/center}">
                    <i class="lucide-chevron-left" aria-hidden="true"></i> Mi Centro
                </a>
                <th:block th:replace="~{worker/fragments/center-sections :: __${section}__}"></th:block>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de gestión de centros.')}"></div>
</body>
</html>
