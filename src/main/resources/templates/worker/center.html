<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Centro - Cuquora CRM</title>
    <!-- Lucide Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/worker.css">
</head>
<body class="landing-page-view">
    <!-- Generic Global Navbar -->
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel principal', ${notifications})}"></div>

    <!-- Main Container -->
    <main class="main-container" style="max-width: 920px; margin: 0 auto; padding-top: 36px; padding-bottom: 60px;">
        
        <!-- Header -->
        <div class="page-header" style="text-align: left; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
                <div>
                    <h1 style="font-size: 26px; margin: 0; font-weight: 800; color: var(--text-main);" th:text="${center != null ? center.name : 'Mi Centro'}">Mi Centro</h1>
                    <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 14.5px;">Actualiza los datos públicos de tu salón y la configuración de tu cuenta</p>
                </div>

                <a href="/worker/dashboard" class="nav-auth-btn nav-auth-register" style="height: 38px; font-size: 13px;">
                    <i class="lucide-arrow-left" style="margin-right: 6px;"></i> Volver al Panel
                </a>
            </div>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${successMessage != null}" style="background: rgba(46, 125, 50, 0.1); border: 1px solid rgba(46, 125, 50, 0.3); border-radius: 14px; padding: 14px 20px; color: #2e7d32; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <i class="lucide-check-circle-2"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage != null}" style="background: rgba(211, 47, 47, 0.1); border: 1px solid rgba(211, 47, 47, 0.3); border-radius: 14px; padding: 14px 20px; color: #d32f2f; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <i class="lucide-alert-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Center & Account Edit Form -->
        <div class="glass-panel" style="background: #ffffff; border: 1px solid rgba(197, 168, 128, 0.35); border-radius: 20px; padding: 32px 36px; box-shadow: 0 8px 30px rgba(197, 168, 128, 0.08);">
            <form action="/worker/center" method="POST">
                
                <!-- Section 1: Center Commercial Data -->
                <div th:if="${center != null}">
                    <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                        <i class="lucide-building-2" style="color: var(--primary-dark);"></i> Información Comercial del Centro
                    </h3>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
                        <div style="grid-column: 1 / -1;">
                            <label for="centerName" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Nombre Oficial del Salón / Centro</label>
                            <input type="text" id="centerName" name="centerName" class="form-control" th:value="${center.name}" required
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div style="grid-column: 1 / -1;">
                            <label for="centerAddress" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Dirección Completa</label>
                            <input type="text" id="centerAddress" name="centerAddress" class="form-control" th:value="${center.address}" placeholder="Calle, número, código postal y ciudad"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="centerPhone" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Teléfono de Atención al Cliente</label>
                            <input type="tel" id="centerPhone" name="centerPhone" class="form-control" th:value="${center.phone}" placeholder="Ej: 912 345 678"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="centerEmail" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Correo Comercial de Contacto</label>
                            <input type="email" id="centerEmail" name="centerEmail" class="form-control" th:value="${center.email}" placeholder="info@tucentro.com"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="latitude" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Latitud GPS</label>
                            <input type="number" step="any" id="latitude" name="latitude" class="form-control" th:value="${center.latitude}" placeholder="Ej: 40.4168"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="longitude" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Longitud GPS</label>
                            <input type="number" step="any" id="longitude" name="longitude" class="form-control" th:value="${center.longitude}" placeholder="Ej: -3.7038"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Worker Account & Credentials -->
                <div style="border-top: 1px dashed rgba(197, 168, 128, 0.35); padding-top: 24px; margin-bottom: 28px;">
                    <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                        <i class="lucide-user-cog" style="color: var(--primary-dark);"></i> Mi Cuenta de Profesional
                    </h3>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label for="workerName" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Nombre del Profesional / Gestor</label>
                            <input type="text" id="workerName" name="workerName" class="form-control" th:value="${worker.name}" required
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="workerPhone" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Teléfono Profesional</label>
                            <input type="tel" id="workerPhone" name="workerPhone" class="form-control" th:value="${worker.phone}" placeholder="Ej: 600 000 000"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div style="grid-column: 1 / -1;">
                            <label for="workerEmail" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Correo de Acceso (Usuario)</label>
                            <input type="email" id="workerEmail" class="form-control" th:value="${worker.email}" disabled
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px; background: #fbf9f6; color: var(--text-muted); cursor: not-allowed;">
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <h4 style="font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="lucide-key" style="color: var(--primary-dark);"></i> Cambiar Contraseña Profesional <span style="font-size: 12px; font-weight: 500; color: var(--text-muted);">(Opcional)</span>
                        </h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 12px;">
                            <div>
                                <label for="newPassword" style="display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Nueva Contraseña</label>
                                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Mínimo 6 caracteres"
                                       style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                            </div>

                            <div>
                                <label for="confirmPassword" style="display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 6px;">Confirmar Contraseña</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite la contraseña"
                                       style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 14px;">
                    <a href="/worker/dashboard" class="nav-auth-btn nav-auth-register" style="height: 42px; padding: 0 22px;">Cancelar</a>
                    <button type="submit" class="nav-auth-btn nav-auth-login" style="height: 42px; padding: 0 26px; border: none; cursor: pointer; font-size: 14px;">
                        <i class="lucide-save" style="margin-right: 6px;"></i> Guardar Información
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de Gestión de Centros.')}"></div>
</body>
</html>
