<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Mi Centro - Cuquora CRM')}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel', ${notifications})}"></div>

    <main class="main-container settings-page">
        <header class="settings-header">
            <div>
                <h1 th:text="${center.name}">Mi Centro</h1>
                <p>Actualiza los datos públicos de tu salón y la configuración de tu cuenta</p>
            </div>
            <a href="/worker/dashboard" class="btn btn-secondary btn-sm-height">
                <i class="lucide-arrow-left" aria-hidden="true"></i> Volver al Panel
            </a>
        </header>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <section class="settings-card">
            <form th:action="@{/worker/center}" method="post">
                <h2 class="settings-section-title"><i class="lucide-building-2" aria-hidden="true"></i> Información Comercial del Centro</h2>
                <div class="settings-grid">
                    <div class="span-full">
                        <label for="centerName" class="form-label">Nombre Oficial del Salón / Centro</label>
                        <input type="text" id="centerName" name="centerName" class="form-control" th:value="${center.name}" required>
                    </div>
                    <div class="span-full">
                        <label for="centerAddress" class="form-label">Dirección Completa</label>
                        <input type="text" id="centerAddress" name="centerAddress" class="form-control" th:value="${center.address}" placeholder="Calle, número, código postal y ciudad">
                    </div>
                    <div>
                        <label for="centerPhone" class="form-label">Teléfono de Atención al Cliente</label>
                        <input type="tel" id="centerPhone" name="centerPhone" class="form-control" th:value="${center.phone}" placeholder="Ej: 912 345 678">
                    </div>
                    <div>
                        <label for="centerEmail" class="form-label">Correo Comercial de Contacto</label>
                        <input type="email" id="centerEmail" name="centerEmail" class="form-control" th:value="${center.email}" placeholder="info@tucentro.com">
                    </div>
                    <div>
                        <label for="latitude" class="form-label">Latitud GPS</label>
                        <input type="number" id="latitude" name="latitude" class="form-control" th:value="${center.latitude}" step="any" placeholder="Ej: 40.4168">
                    </div>
                    <div>
                        <label for="longitude" class="form-label">Longitud GPS</label>
                        <input type="number" id="longitude" name="longitude" class="form-control" th:value="${center.longitude}" step="any" placeholder="Ej: -3.7038">
                    </div>
                </div>

                <div class="settings-section">
                    <h2 class="settings-section-title"><i class="lucide-user-cog" aria-hidden="true"></i> Mi Cuenta de Profesional</h2>
                    <div class="settings-grid">
                    <div>
                        <label for="workerName" class="form-label">Nombre del Profesional / Gestor</label>
                        <input type="text" id="workerName" name="workerName" class="form-control" th:value="${worker.name}" required autocomplete="name">
                    </div>
                    <div>
                        <label for="workerPhone" class="form-label">Teléfono Profesional</label>
                        <input type="tel" id="workerPhone" name="workerPhone" class="form-control" th:value="${worker.phone}" placeholder="Ej: 600 000 000" autocomplete="tel">
                    </div>
                    <div class="span-full">
                        <label for="workerEmail" class="form-label">Correo de Acceso (Usuario)</label>
                        <input type="email" id="workerEmail" class="form-control" th:value="${worker.email}" disabled>
                    </div>
                    </div>

                    <h3 class="settings-subsection-title"><i class="lucide-key" aria-hidden="true"></i> Cambiar Contraseña <span class="settings-optional">(Opcional)</span></h3>
                    <div class="settings-grid">
                    <div>
                        <label for="newPassword" class="form-label">Nueva Contraseña</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    </div>
                    <div>
                        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite la contraseña" autocomplete="new-password">
                    </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <a href="/worker/dashboard" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="lucide-save" aria-hidden="true"></i> Guardar Información</button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de gestión de centros.')}"></div>
</body>
</html>
