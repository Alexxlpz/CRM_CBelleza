<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamientos del Centro - BellaBelleza CRM</title>
    <!-- Lucide Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/worker.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel principal', ${notifications})}"></div>

    <!-- Main Container -->
    <main class="main-container">

        <!-- Page Header -->
        <div class="page-header" style="flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
            <div>
                <h1>Carta de Tratamientos</h1>
                <p th:text="'Servicios de estética activos en ' + ${sessionCenterName}">Servicios de estética activos en tu centro</p>
            </div>
            
            <button type="button" class="btn btn-primary btn-add-treatment" onclick="openTreatmentSheet()" title="Añadir Tratamiento">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="btn-add-label">Añadir Tratamiento</span>
            </button>
        </div>

        <div class="treatments-full-layout">
            <!-- Left Pane: Treatments List -->
            <section style="width: 100%;">
                <div class="treatments-list" th:if="${not #lists.isEmpty(treatments)}">
                    <div class="treatment-item-card glass-panel" th:each="t : ${treatments}">
                        <div class="treatment-item-header">
                            <span class="treatment-item-name" th:text="${t.name}">Manicura</span>
                            <span class="treatment-item-price" th:text="${t.price} + ' €'">0.00 €</span>
                        </div>
                        <p class="treatment-item-desc" th:text="${t.description}">Descripción del tratamiento...</p>
                        <span class="treatment-item-meta" th:text="'Duración: ' + ${t.duration} + ' min'">30 min</span>
                    </div>
                </div>
                
                <div class="no-appointments-box glass-panel" th:if="${#lists.isEmpty(treatments)}">
                    <i class="lucide-slash"></i>
                    <p>No se han registrado tratamientos en este centro. Haz clic en el botón superior para añadir el primero.</p>
                </div>
            </section>
        </div>

        <!-- Mobile FAB Button -->
        <button type="button" class="fab-add-btn" onclick="openTreatmentSheet()" aria-label="Añadir Tratamiento" title="Añadir Tratamiento">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

        <!-- Add Treatment Sheet (Simulated sheet modal) -->
        <div id="addTreatmentSheet" class="sheet-overlay" style="display:none" onclick="closeTreatmentSheetOnOverlay(event)">
            <div class="sheet-content glass-panel" onclick="event.stopPropagation()">
                <div class="bottom-sheet-handle"></div>
                <div class="sheet-header">
                    <h2>Añadir Tratamiento</h2>
                    <button type="button" class="sheet-close" onclick="closeTreatmentSheet()">&times;</button>
                </div>
                
                <form action="/worker/treatments/add" method="POST" class="role-form">
                    <div class="form-group">
                        <label class="form-label" for="treatmentName">Nombre del Tratamiento</label>
                        <input type="text" name="name" id="treatmentName" class="form-control" 
                               placeholder="Ej. Pedicura Spa, Limpieza Facial..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="treatmentType">Categoría / Tipo</label>
                        <select name="type" id="treatmentType" class="form-control" required>
                            <option value="" disabled selected>Elige un tipo...</option>
                            <option value="MANICURA_PEDICURA">Manicura y Pedicura</option>
                            <option value="FACIAL">Tratamientos Faciales</option>
                            <option value="CORPORAL">Tratamientos Corporales</option>
                            <option value="MASAJES">Masajes</option>
                            <option value="PELUQUERIA">Peluquería</option>
                            <option value="DEPILACION">Depilación</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="treatmentDesc">Descripción</label>
                        <textarea name="description" id="treatmentDesc" class="form-control" 
                                  placeholder="Detalla en qué consiste el servicio..." rows="3" style="resize:none" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="treatmentPrice">Precio (€)</label>
                        <input type="number" name="price" id="treatmentPrice" class="form-control" 
                               placeholder="0.00" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="treatmentDuration">Duración (minutos)</label>
                        <input type="number" name="duration" id="treatmentDuration" class="form-control" 
                               value="45" min="5" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                        <i class="lucide-plus"></i> Guardar Tratamiento
                    </button>
                </form>
            </div>
        </div>
        
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 BellaBelleza CRM. Panel de gestión operativa.')}"></div>

    <!-- Notifications script -->
    <script>
        function openTreatmentSheet() {
            const sheet = document.getElementById('addTreatmentSheet');
            sheet.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
            setTimeout(() => {
                document.getElementById('treatmentName').focus();
            }, 100);
        }

        function closeTreatmentSheet() {
            const sheet = document.getElementById('addTreatmentSheet');
            sheet.style.display = 'none';
            document.body.style.overflow = 'auto'; // Restore background scrolling
        }

        function closeTreatmentSheetOnOverlay(event) {
            if (event.target.id === 'addTreatmentSheet') {
                closeTreatmentSheet();
            }
        }

        // Bottom Sheet Drag to Dismiss
        function initBottomSheetDrag() {
            document.querySelectorAll('.bottom-sheet-handle').forEach(handle => {
                let startY = 0;
                let currentDeltaY = 0;
                let isDragging = false;
                const modalCard = handle.closest('.sheet-content, .info-modal-card');
                const overlay = handle.closest('.sheet-overlay, .info-modal-overlay');

                if (!modalCard || !overlay) return;

                function onStart(e) {
                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                    isDragging = true;
                    modalCard.style.transition = 'none';
                    
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd);
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                }

                function onMove(e) {
                    if (!isDragging) return;
                    const currentY = e.touches ? e.touches[0].clientY : e.clientY;
                    currentDeltaY = currentY - startY;

                    if (currentDeltaY > 0) { // Dragging downwards
                        if (e.cancelable) e.preventDefault();
                        modalCard.style.transform = `translateY(${currentDeltaY}px)`;
                        overlay.style.opacity = `${Math.max(0.1, 1 - currentDeltaY / 300)}`;
                    }
                }

                function onEnd() {
                    if (!isDragging) return;
                    isDragging = false;

                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onEnd);
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onEnd);

                    modalCard.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease';

                    if (currentDeltaY > 70) {
                        modalCard.style.transform = 'translateY(100%)';
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            closeTreatmentSheet();
                            modalCard.style.transform = '';
                            modalCard.style.transition = '';
                            overlay.style.opacity = '';
                            currentDeltaY = 0;
                        }, 220);
                    } else {
                        modalCard.style.transform = 'translateY(0)';
                        overlay.style.opacity = '1';
                        setTimeout(() => {
                            modalCard.style.transition = '';
                            currentDeltaY = 0;
                        }, 250);
                    }
                }

                handle.addEventListener('touchstart', onStart, { passive: true });
                handle.addEventListener('mousedown', onStart);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initBottomSheetDrag();
        });
    </script>
</body>
</html>
