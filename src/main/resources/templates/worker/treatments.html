<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Tratamientos del Centro - Cuquora CRM')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/treatments.css}">
    <script th:src="@{/js/sheets.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel principal', ${notifications})}"></div>

    <main class="main-container">
        <div class="page-header treatments-header">
            <div>
                <h1>Carta de Tratamientos</h1>
                <p th:text="'Servicios de estética activos en ' + ${sessionCenterName}">Servicios de estética activos en tu centro</p>
            </div>
            <button type="button" class="btn btn-primary btn-add-treatment" data-sheet-open="addTreatmentSheet">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="btn-add-label">Añadir Tratamiento</span>
            </button>
        </div>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <div class="treatments-full-layout">
            <section class="treatments-section" aria-label="Tratamientos del centro">
                <div class="treatments-list" th:if="${not #lists.isEmpty(treatments)}">
                    <article class="treatment-item-card glass-panel" th:each="t : ${treatments}">
                        <div class="treatment-item-header">
                            <h2 class="treatment-item-name" th:text="${t.name}">Manicura</h2>
                            <span class="treatment-item-price" th:text="${#numbers.formatDecimal(t.price, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                        </div>
                        <p class="treatment-item-desc" th:text="${t.description}">Descripción del tratamiento...</p>
                        <span class="treatment-item-meta" th:text="'Duración: ' + ${t.duration} + ' min'">30 min</span>
                    </article>
                </div>

                <div class="no-appointments-box glass-panel" th:if="${#lists.isEmpty(treatments)}">
                    <i class="lucide-slash" aria-hidden="true"></i>
                    <p>No se han registrado tratamientos en este centro. Pulsa «Añadir Tratamiento» para crear el primero.</p>
                </div>
            </section>
        </div>

        <button type="button" class="fab-add-btn" data-sheet-open="addTreatmentSheet" aria-label="Añadir tratamiento">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </main>

    <div th:replace="~{worker/fragments/treatment-modals :: addTreatmentSheet}"></div>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de gestión de centros.')}"></div>
</body>
</html>
