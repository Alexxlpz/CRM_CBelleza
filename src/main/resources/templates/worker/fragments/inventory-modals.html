<div xmlns:th="http://www.thymeleaf.org">
    <!-- Ficha de cada producto (se abre con data-sheet-open="detailModal_{id}") -->
    <div th:fragment="productDetailModals(items)">
        <div th:each="item : ${items}" th:id="'detailModal_' + ${item.id}" class="info-modal-overlay" hidden>
            <div class="info-modal-card" role="dialog" aria-modal="true" th:attr="aria-labelledby='detailTitle_' + ${item.id}">
                <div class="bottom-sheet-handle" aria-hidden="true"></div>
                <div class="info-modal-header">
                    <h2 th:id="'detailTitle_' + ${item.id}" th:text="${item.product.name}">Detalle del Producto</h2>
                </div>
                <div class="info-modal-body">
                    <div class="info-modal-media">
                        <img th:src="${item.product.category == 'Rostro' ? '/images/face_serum.webp' : (item.product.category == 'Cabello' ? '/images/hair_oil.webp' : '/images/beauty_salon_hero.webp')}"
                             alt="" loading="lazy">
                    </div>
                    <div class="info-modal-details">
                        <div class="info-detail-row">
                            <span class="info-detail-label">Categoría</span>
                            <span class="product-category" th:text="${item.product.category}">Categoría</span>
                        </div>
                        <div class="info-detail-row">
                            <span class="info-detail-label">Precio Unitario</span>
                            <span class="info-detail-price" th:text="${#numbers.formatDecimal(item.product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                        </div>
                        <div class="info-detail-row">
                            <span class="info-detail-label">Stock en Centro</span>
                            <span class="info-detail-stock" th:text="${item.stock} + ' unidades'">0 ud</span>
                        </div>
                        <div class="info-detail-box">
                            <span class="info-detail-label">Descripción del Producto</span>
                            <p th:text="${item.product.description}">Descripción detallada...</p>
                        </div>
                    </div>
                </div>
                <div class="info-modal-footer">
                    <button type="button" class="btn btn-secondary" data-sheet-close>Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel para añadir productos al inventario -->
    <div id="addProductModal" class="sheet-overlay" hidden th:fragment="addProductSheet(catalogProducts)">
        <div class="sheet-content" role="dialog" aria-modal="true" aria-labelledby="addProductTitle">
            <div class="bottom-sheet-handle" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="addProductTitle">Añadir al Inventario</h2>
                <button type="button" class="sheet-close" data-sheet-close aria-label="Cerrar">&times;</button>
            </div>

            <form th:action="@{/worker/inventory/add}" method="post">
                <input type="hidden" name="mode" id="input-mode" value="existing">

                <div class="form-mode-tabs" role="tablist" aria-label="Origen del producto" id="addModeTabs" data-tabs>
                    <button type="button" class="form-mode-tab active" role="tab" id="tab-existing" data-mode="existing"
                            aria-selected="true" aria-controls="group-existing">Elegir del Catálogo</button>
                    <button type="button" class="form-mode-tab" role="tab" id="tab-new" data-mode="new"
                            aria-selected="false" aria-controls="group-new" tabindex="-1">Crear Nuevo Producto</button>
                </div>

                <div id="group-existing" class="mode-content active" role="tabpanel" aria-labelledby="tab-existing">
                    <div class="form-group">
                        <label class="form-label" for="productId">Buscar Producto en Catálogo</label>
                        <select name="productId" id="productId" class="form-control">
                            <option value="" disabled selected>Elige un producto creado previamente...</option>
                            <option th:each="prod : ${catalogProducts}" th:value="${prod.id}"
                                    th:text="${prod.name} + ' (' + ${prod.category} + ' - ' + ${#numbers.formatDecimal(prod.price, 1, 'POINT', 2, 'COMMA')} + ' €)'">
                                Champú de Queratina
                            </option>
                        </select>
                        <span class="catalog-hint">
                            *Se muestran productos del catálogo general que todavía no están en el inventario de tu centro.
                        </span>
                    </div>
                </div>

                <div id="group-new" class="mode-content" role="tabpanel" aria-labelledby="tab-new" hidden>
                    <div class="form-group">
                        <label class="form-label" for="name">Nombre del Producto</label>
                        <input type="text" name="name" id="name" class="form-control" placeholder="Ej. Sérum Reparador Noche...">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="description">Descripción</label>
                        <textarea name="description" id="description" class="form-control form-textarea-fixed" placeholder="Escribe detalles del producto..." rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="category">Categoría</label>
                        <select name="category" id="category" class="form-control">
                            <option value="Rostro">Rostro</option>
                            <option value="Cabello">Cabello</option>
                            <option value="Uñas">Uñas</option>
                            <option value="Cuerpo">Cuerpo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="price">Precio de Venta (€)</label>
                        <input type="number" name="price" id="price" class="form-control" placeholder="0.00" step="0.01" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="stock">Stock Inicial</label>
                    <input type="number" name="stock" id="stock" class="form-control" value="5" min="0" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="lucide-plus" aria-hidden="true"></i> Guardar y Añadir a Stock
                </button>
            </form>
        </div>
    </div>
</div>
