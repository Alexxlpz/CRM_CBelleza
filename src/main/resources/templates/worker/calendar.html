<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Agenda del Salón - Cuquora CRM')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel principal', ${notifications})}"></div>

    <!-- Main Container -->
    <main class="main-container main-container--wide">

        <div class="page-header">
            <h1>Agenda Mensual</h1>
            <p>Consulta las citas agendadas y los detalles de los clientes por día</p>
        </div>

        <div class="calendar-split-layout">
            
            <!-- Left Pane: Monthly Calendar Grid -->
            <section class="calendar-card glass-panel">
                <div class="calendar-header">
                    <h2 class="calendar-month-title" id="calendarMonthYear" aria-live="polite">Julio 2026</h2>
                    <div class="calendar-header-nav">
                        <button type="button" class="calendar-nav-btn" id="prevMonthBtn" aria-label="Mes anterior">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                        <button type="button" class="calendar-nav-btn" id="nextMonthBtn" aria-label="Mes siguiente">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="calendar-weekdays" aria-hidden="true">
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mié</div>
                    <div>Jue</div>
                    <div>Vie</div>
                    <div>Sáb</div>
                    <div>Dom</div>
                </div>
                
                <div class="calendar-days-grid" id="calendarDays">
                    <!-- Dynamic rendering in JS -->
                </div>
            </section>
            
            <!-- Right Pane: Selected Day Agenda Details -->
            <section class="agenda-panel glass-panel">
                <div class="agenda-header">
                    <h2 id="selectedDateTitle" tabindex="-1">Selecciona un día</h2>
                    <p id="selectedDateCount">Citas programadas para la fecha elegida</p>
                </div>
                
                <div class="agenda-list" id="agendaList" aria-live="polite">
                    <div class="notification-empty">
                        <i class="lucide-calendar-days" aria-hidden="true"></i>
                        <span>Haz clic en un día del calendario para ver las citas de esa jornada</span>
                    </div>
                </div>
            </section>
            
        </div>
        
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de gestión de centros.')}"></div>

    <!-- Citas del centro (JSON) para el calendario -->
    <script th:inline="javascript">
        window.CALENDAR_APPOINTMENTS = /*[[${appointments}]]*/ [];
    </script>
    <script th:src="@{/js/worker-calendar.js}" defer></script>
</body>
</html>
