<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Control de Inventario - Cuquora CRM')}"></th:block>
    <link rel="stylesheet" href="/css/inventario.css">
    <script src="/js/sheets.js" defer></script>
</head>
<body>
    <div th:replace="~{fragments/navbar :: worker('/worker/dashboard', 'Volver al panel principal', ${notifications})}"></div>

    <main class="main-container">
        <div class="page-header inventory-page-header">
            <div>
                <h1>Gestión de Inventario</h1>
                <p th:text="${#lists.size(inventoryItems)} + ' productos registrados en el stock del salón'">0 productos registrados</p>
            </div>
            <button type="button" class="btn btn-primary btn-add-product" data-sheet-open="addProductModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="btn-add-label">Añadir Producto</span>
            </button>
        </div>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <div class="category-filter-bar" role="toolbar" aria-label="Filtrar por categoría">
            <button type="button" class="category-pill active" data-category-filter="ALL" aria-pressed="true">Todos</button>
            <button type="button" class="category-pill" data-category-filter="Rostro" aria-pressed="false">Rostro</button>
            <button type="button" class="category-pill" data-category-filter="Cabello" aria-pressed="false">Cabello</button>
            <button type="button" class="category-pill" data-category-filter="Uñas" aria-pressed="false">Uñas</button>
            <button type="button" class="category-pill" data-category-filter="Cuerpo" aria-pressed="false">Cuerpo</button>
        </div>

        <div class="inventory-grid" id="inventoryGrid" th:if="${not #lists.isEmpty(inventoryItems)}">
            <article class="inventory-card glass-panel" th:each="item : ${inventoryItems}" th:data-category="${item.product.category}">
                <img th:src="${item.product.category == 'Rostro' ? '/images/face_serum.webp' : (item.product.category == 'Cabello' ? '/images/hair_oil.webp' : '/images/beauty_salon_hero.webp')}"
                     class="product-thumbnail" alt="" loading="lazy" width="96" height="96">

                <div class="inventory-card-info">
                    <h2 class="product-name" th:text="${item.product.name}">Producto</h2>
                    <div class="product-meta">
                        <span class="product-price" th:text="${#numbers.formatDecimal(item.product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                        <span class="product-category" th:text="${item.product.category}">Categoría</span>
                    </div>
                    <p class="product-description-short" th:text="${item.product.description}">Descripción del producto...</p>

                    <div class="inventory-card-actions">
                        <button type="button" class="btn-card-action" th:attr="data-sheet-open='detailModal_' + ${item.id}">
                            <i class="lucide-info" aria-hidden="true"></i> Ver Info
                        </button>
                        <form th:action="@{/worker/inventory/{id}/delete(id=${item.id})}" method="post" class="delete-form"
                              data-confirm="El producto se retirará del inventario de tu centro, pero se conservará en el catálogo general."
                              data-confirm-title="¿Eliminar este producto?" data-confirm-button="Eliminar">
                            <button type="submit" class="btn-card-action btn-delete" th:aria-label="'Eliminar ' + ${item.product.name} + ' del inventario'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="stock-adjust-panel">
                    <div class="stock-value-wrapper">
                        <span class="stock-label">Stock:</span>
                        <span class="stock-count-val" th:text="${item.stock}" aria-live="polite">0</span>
                    </div>
                    <div class="stock-adjust-actions">
                        <button type="button" class="btn-adjust btn-decrement" th:data-id="${item.id}" data-change="-1"
                                th:disabled="${item.stock == 0}" th:aria-label="'Restar una unidad de ' + ${item.product.name}">-1</button>
                        <button type="button" class="btn-adjust btn-increment" th:data-id="${item.id}" data-change="1"
                                th:aria-label="'Sumar una unidad de ' + ${item.product.name}">+1</button>
                    </div>
                    <span class="badge badge-pill badge-micro stock-badge"
                          th:classappend="${item.stock == 0 ? 'badge-rejected' : (item.stock <= 3 ? 'badge-pending' : 'badge-confirmed')}"
                          th:text="${item.stock == 0 ? 'Agotado' : (item.stock <= 3 ? 'Bajo Stock' : 'Normal')}">Normal</span>
                </div>
            </article>
        </div>

        <div th:replace="~{worker/fragments/inventory-modals :: productDetailModals(${inventoryItems})}"></div>

        <div class="no-appointments-box glass-panel" th:if="${#lists.isEmpty(inventoryItems)}">
            <i class="lucide-package-x" aria-hidden="true"></i>
            <p>No hay existencias en stock. Comienza añadiendo productos desde el catálogo.</p>
        </div>

        <button type="button" class="fab-add-btn" data-sheet-open="addProductModal" aria-label="Añadir producto">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </main>

    <div th:replace="~{worker/fragments/inventory-modals :: addProductSheet(${catalogProducts})}"></div>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Panel de gestión de centros.')}"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ---- Filtro por categoría ---- */
            document.querySelectorAll('[data-category-filter]').forEach(button => {
                button.addEventListener('click', () => {
                    const category = button.dataset.categoryFilter;
                    document.querySelectorAll('[data-category-filter]').forEach(b => {
                        b.classList.toggle('active', b === button);
                        b.setAttribute('aria-pressed', String(b === button));
                    });
                    document.querySelectorAll('#inventoryGrid .inventory-card').forEach(card => {
                        card.hidden = category !== 'ALL' && card.dataset.category !== category;
                    });
                });
            });

            /* ---- Alta: catálogo existente o producto nuevo ---- */
            const modeInput = document.getElementById('input-mode');
            const productSelect = document.getElementById('productId');
            const newRequired = [document.getElementById('name'), document.getElementById('price')];
            function applyMode(mode) {
                modeInput.value = mode;
                productSelect.required = mode === 'existing';
                newRequired.forEach(input => { input.required = mode === 'new'; });
            }
            const tablist = document.getElementById('addModeTabs');
            tablist.addEventListener('tabchange', e => applyMode(e.detail.tab.dataset.mode));
            applyMode(tablist.querySelector('[aria-selected="true"]')?.dataset.mode || 'existing');

            /* ---- Ajuste rápido de stock ---- */
            function stockBadge(badge, stock, lowThreshold) {
                badge.classList.remove('badge-rejected', 'badge-pending', 'badge-confirmed');
                if (stock === 0) { badge.classList.add('badge-rejected'); badge.textContent = 'Agotado'; }
                else if (stock <= lowThreshold) { badge.classList.add('badge-pending'); badge.textContent = 'Bajo Stock'; }
                else { badge.classList.add('badge-confirmed'); badge.textContent = 'Normal'; }
            }

            document.querySelectorAll('.btn-adjust').forEach(button => {
                button.addEventListener('click', async () => {
                    const card = button.closest('.inventory-card');
                    const stockValue = card.querySelector('.stock-count-val');
                    const decrement = card.querySelector('.btn-decrement');
                    card.querySelectorAll('.btn-adjust').forEach(b => { b.disabled = true; });
                    try {
                        const response = await fetch(`/worker/inventory/${encodeURIComponent(button.dataset.id)}/adjust-stock`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({ change: button.dataset.change })
                        });
                        if (!response.ok) {
                            throw new Error(await Cuquora.errorMessage(response, 'No se ha podido actualizar el stock.'));
                        }
                        const { stock, lowStockThreshold } = await response.json();
                        stockValue.textContent = stock;
                        stockValue.classList.remove('pulsing');
                        void stockValue.offsetWidth;
                        stockValue.classList.add('pulsing');
                        stockBadge(card.querySelector('.stock-badge'), stock, lowStockThreshold);
                        card.querySelector('.btn-increment').disabled = false;
                        decrement.disabled = stock === 0;
                    } catch (err) {
                        card.querySelectorAll('.btn-adjust').forEach(b => { b.disabled = false; });
                        decrement.disabled = Number(stockValue.textContent) === 0;
                        Cuquora.alert(err.message || 'Error de conexión al actualizar el stock.', 'No se ha podido actualizar el stock');
                    }
                });
            });
        });
    </script>
</body>
</html>
