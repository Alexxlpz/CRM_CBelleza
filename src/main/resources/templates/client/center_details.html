<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: meta('Detalles del Centro - Cuquora')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/datepicker.css}">
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <!-- Main Container -->
    <main class="main-container booking-page">
        <!-- Error Modal Component -->
        <div th:replace="~{fragments/modals :: bookingError(${bookingError})}"></div>

        <!-- Center Hero Header Component -->
        <div th:replace="~{client/fragments/center-hero :: hero(${center})}"></div>

        <section class="glass-panel booking-section">
            <h2 class="booking-section-title">
                <i class="lucide-calendar-plus" aria-hidden="true"></i>
                Solicitar Cita de Estética
            </h2>

            <form th:action="@{/client/booking}" method="post" id="bookingForm" novalidate
                  th:classappend="${not #lists.isEmpty(treatments)} ? 'booking-form--split'"
                  th:attr="data-rebook=${selectedTreatmentId != null}">
                <input type="hidden" name="centerId" th:value="${center.id}">

                <!-- 1. Selectable Treatments list -->
                <div class="form-group booking-services">
                    <label class="form-label booking-step-label">1. Elige un servicio disponible</label>
                    <!-- Solo si hay ofertas: filtra la misma lista, el servicio elegido no se pierde al cambiar -->
                    <div class="view-toggle view-toggle--always booking-filter" role="group" aria-label="Mostrar servicios"
                         th:if="${offerCount > 0}">
                        <button type="button" class="view-toggle-btn" data-booking-filter="all" aria-pressed="true">
                            <i class="lucide-list" aria-hidden="true"></i> Todos los servicios
                        </button>
                        <button type="button" class="view-toggle-btn" data-booking-filter="offers" aria-pressed="false">
                            <i class="lucide-tag" aria-hidden="true"></i> En oferta
                            <span class="booking-filter-count" th:text="${offerCount}">2</span>
                        </button>
                    </div>
                    <div class="treatment-select-grid" th:if="${not #lists.isEmpty(treatments)}">
                        <label class="treatment-select-card" th:each="t : ${treatments}"
                               th:with="onOffer=${t.hasActiveOffer(today)}"
                               th:attr="data-offer=${onOffer}">
                            <input type="radio" name="treatmentId" th:value="${t.id}"
                                th:attr="data-workers=${t.doneByIds(workers)},data-duration=${t.duration}"
                                th:checked="${t.id == selectedTreatmentId}" required>
                            <span class="offer-badge" th:if="${onOffer}">
                                <i class="lucide-tag" aria-hidden="true"></i>
                                <span th:text="'-' + ${t.offerDiscountPercent()} + ' %' + (${t.offerEndsOn != null} ? ' · ' + ${t.offerEndsLabel()} : '')">-20 % · hasta el 30 oct</span>
                            </span>
                            <span class="treatment-card-title" th:text="${t.name}">Manicura</span>
                            <span class="treatment-card-desc" th:text="${t.description}">Descripción del
                                servicio...</span>
                            <div class="treatment-card-meta">
                                <span class="treatment-card-price">
                                    <span th:text="${#numbers.formatDecimal(t.priceOn(today), 1, 'POINT', 2, 'COMMA')} + ' €'">32,00 €</span>
                                    <s class="treatment-card-old-price" th:if="${onOffer}"
                                       th:text="${#numbers.formatDecimal(t.price, 1, 'POINT', 2, 'COMMA')} + ' €'">40,00 €</s>
                                </span>
                                <span class="treatment-card-duration" th:text="${t.duration} + ' min'">30 min</span>
                            </div>
                        </label>
                    </div>
                    <!-- En móvil, tras elegir servicio la lista se pliega al elegido (booking-picker.js) -->
                    <button type="button" class="btn btn-secondary btn-sm booking-change-service" id="changeService" hidden>
                        <i class="lucide-pen-line" aria-hidden="true"></i> Cambiar de servicio
                    </button>
                    <div th:if="${#lists.isEmpty(treatments)}" class="no-appointments-box">
                        <i class="lucide-sparkles" aria-hidden="true"></i>
                        <p>Este centro no dispone de tratamientos activos en este momento.</p>
                    </div>
                </div>

                <!-- 2. Profesional (solo si el equipo es de más de una persona) -->
                <th:block th:if="${not #lists.isEmpty(treatments) and #lists.size(workers) > 1}">
                    <fieldset th:replace="~{fragments/booking-workers :: workers(${workers}, ${selectedWorkerId}, 2)}"></fieldset>
                </th:block>

                <!-- 3. Día y hora -->
                <div class="form-group booking-datetime-group" th:if="${not #lists.isEmpty(treatments)}">
                    <p class="form-label booking-step-label" th:text="${#lists.size(workers) > 1 ? '3' : '2'} + '. Elige día y hora'">3. Elige día y hora</p>
                    <div th:replace="~{fragments/datetime-picker :: picker}"></div>
                </div>

                <div class="booking-confirm" th:if="${not #lists.isEmpty(treatments)}">
                    <p class="booking-summary" id="bookingSummary">Elige un servicio, un día y una hora para tu cita.</p>
                    <p class="booking-mode" th:if="${center.autoAcceptBookings}">
                        <i class="lucide-zap" aria-hidden="true"></i> Este centro confirma las citas al momento.
                    </p>
                    <p class="booking-mode" th:unless="${center.autoAcceptBookings}">
                        <i class="lucide-hourglass" aria-hidden="true"></i> El centro revisará tu solicitud y te avisaremos cuando la confirme.
                    </p>
                    <button type="submit" class="btn btn-primary btn-large-submit">
                        <i class="lucide-check-circle" aria-hidden="true"></i> <span th:text="${center.autoAcceptBookings} ? 'Reservar cita' : 'Solicitar cita'">Solicitar cita</span>
                    </button>
                </div>
            </form>
        </section>

    </main>


    <script th:src="@{/js/booking-picker.js}" defer></script>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética, salones y spas.')}"></div>

</body>

</html>
