<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: meta('Detalles del Centro - Cuquora')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/datepicker.css}">
    <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Error Modal Component -->
        <div th:replace="~{fragments/modals :: bookingError(${bookingError})}"></div>

        <!-- Center Hero Header Component -->
        <div th:replace="~{client/fragments/center-hero :: hero(${center})}"></div>

        <section class="glass-panel booking-section">
            <h2 class="booking-section-title">
                <i class="lucide-calendar-plus" aria-hidden="true"></i>
                Solicitar Cita de Estética
            </h2>

            <form th:action="@{/client/booking}" method="post" id="bookingForm">
                <input type="hidden" name="centerId" th:value="${center.id}">

                <!-- 1. Selectable Treatments list -->
                <div class="form-group">
                    <label class="form-label booking-step-label">1. Elige un servicio disponible</label>
                    <div class="treatment-select-grid" th:if="${not #lists.isEmpty(treatments)}">
                        <label class="treatment-select-card" th:each="t, iter : ${treatments}">
                            <input type="radio" name="treatmentId" th:value="${t.id}"
                                th:attr="data-duration=${t.duration}" th:checked="${iter.index == 0}" required>
                            <span class="treatment-card-title" th:text="${t.name}">Manicura</span>
                            <span class="treatment-card-desc" th:text="${t.description}">Descripción del
                                servicio...</span>
                            <div class="treatment-card-meta">
                                <span class="treatment-card-price" th:text="${t.price} + ' €'">0.00 €</span>
                                <span class="treatment-card-duration" th:text="${t.duration} + ' min'">30 min</span>
                            </div>
                        </label>
                    </div>
                    <div th:if="${#lists.isEmpty(treatments)}" class="no-appointments-box">
                        <i class="lucide-slash" aria-hidden="true"></i>
                        <p>Este centro no dispone de tratamientos activos en este momento.</p>
                    </div>
                </div>

                <!-- 2. DateTime picker Component -->
                <div class="form-group booking-datetime-group" th:if="${not #lists.isEmpty(treatments)}">
                    <label class="form-label booking-step-label" for="datepickerTrigger">2. Elige Fecha y Hora</label>
                    <div id="datepickerTrigger" th:replace="~{fragments/datetime-picker :: picker}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-large-submit"
                    th:if="${not #lists.isEmpty(treatments)}">
                    <i class="lucide-check-circle" aria-hidden="true"></i> Confirmar y Reservar Cita
                </button>
            </form>
        </section>

    </main>


    <script th:src="@{/js/booking-picker.js}" defer></script>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética, salones y spas.')}"></div>

</body>

</html>
