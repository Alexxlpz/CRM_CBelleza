<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - BellaBelleza</title>
    <!-- Lucide Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/citas.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: client('/client/centers', 'Volver a Centros')}"></div>

    <!-- Main Container -->
    <main class="main-container">
        
        <div class="page-header">
            <h1>Mis Reservas</h1>
            <p>Estado y agenda de tus citas en BellaBelleza</p>
        </div>

        <div class="category-filter-bar">
            <button type="button" class="category-pill active" onclick="filterAppointments('all', this)">
                <i class="lucide-sparkles"></i> Todos
            </button>
            <button type="button" class="category-pill" onclick="filterAppointments('CONFIRMADA', this)">
                <i class="lucide-smile"></i> Confirmadas
            </button>
            <button type="button" class="category-pill" onclick="filterAppointments('PENDIENTE', this)">
                <i class="lucide-heart-handshake"></i> Pendientes
            </button>
            <button type="button" class="category-pill" onclick="filterAppointments('RECHAZADA', this)">
                <i class="lucide-scissors"></i> Rechazadas
            </button>
        </div>


        <!-- Phone search widget (for anonymous guests) -->
        <div class="guest-search-panel glass-panel" th:if="${sessionUserName == 'Invitado'}">
            <h3>Buscar Reservas por Número de Teléfono</h3>
            <form action="/client/appointments" method="GET">
                <input type="tel" name="searchPhone" class="form-control" 
                       placeholder="Ingresa el teléfono utilizado para reservar..." 
                       th:value="${currentSearchPhone}" required>
                <button type="submit" class="btn btn-primary">
                    <i class="lucide-search"></i> <span>Buscar</span>
                </button>
            </form>
        </div>

        <!-- Appointments Cards Grid -->
        <div class="appointments-grid" th:if="${not #lists.isEmpty(appointments)}">
            <th:block th:each="app : ${appointments}">
                <div th:replace="~{fragments/appointment-card :: card(${app})}"></div>
            </th:block>
        </div>

        <!-- Empty state -->
        <div class="no-appointments-box glass-panel" th:if="${#lists.isEmpty(appointments)}">
            <i class="lucide-calendar-off"></i>
            <p th:if="${sessionUserName != 'Invitado'}">No posees citas registradas.</p>
            <p th:if="${sessionUserName == 'Invitado' and currentSearchPhone == null}">Ingresa tu número de teléfono de contacto arriba para consultar tus reservas.</p>
            <p th:if="${sessionUserName == 'Invitado' and currentSearchPhone != null}">No se encontraron reservas asociadas al teléfono especificado.</p>
        </div>
        
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer('© 2026 BellaBelleza CRM. Prototipo responsive.')}"></div>
</body>

    <script>
        function filterAppointments(filter, button) {
            // Remove 'active' class from all buttons
            const buttons = document.querySelectorAll('.category-pill');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Add 'active' class to the clicked button
            button.classList.add('active');

            // Get all appointment cards
            const cards = document.querySelectorAll('.appointment-card');

            // Show/hide cards based on the filter
            cards.forEach(card => {
                const statusBadge = card.querySelector('.badge');
                if (filter === 'all') {
                    card.style.display = 'block';
                } else if (statusBadge && statusBadge.textContent.trim().toLowerCase() === filter.toLowerCase()) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });

        }
    </script>

</html>
