<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Mis Citas - Cuquora')}"></th:block>
    <link rel="stylesheet" href="/css/citas.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <main class="main-container">
        <div class="page-header">
            <h1>Mis Reservas</h1>
            <p>Estado y agenda de tus citas en Cuquora</p>
        </div>

        <div class="category-filter-bar" role="toolbar" aria-label="Filtrar citas por estado">
            <button type="button" class="category-pill active" data-filter="ALL" aria-pressed="true">
                <i class="lucide-sparkles" aria-hidden="true"></i> Todas
            </button>
            <button type="button" class="category-pill" data-filter="CONFIRMED" aria-pressed="false">
                <i class="lucide-smile" aria-hidden="true"></i> Confirmadas
            </button>
            <button type="button" class="category-pill" data-filter="COMPLETED" aria-pressed="false">
                <i class="lucide-check-circle-2" aria-hidden="true"></i> Completadas
            </button>
            <button type="button" class="category-pill" data-filter="PENDING" aria-pressed="false">
                <i class="lucide-hourglass" aria-hidden="true"></i> Pendientes
            </button>
            <button type="button" class="category-pill" data-filter="REJECTED" aria-pressed="false">
                <i class="lucide-x-circle" aria-hidden="true"></i> Rechazadas
            </button>
        </div>

        <div class="appointments-grid" id="appointmentsGrid" th:if="${not #lists.isEmpty(appointments)}">
            <th:block th:each="app : ${appointments}">
                <div th:replace="~{fragments/appointment-card :: card(${app})}"></div>
            </th:block>
        </div>

        <div class="no-appointments-box glass-panel" id="noFilterResults" hidden>
            <i class="lucide-filter-x" aria-hidden="true"></i>
            <p>No tienes citas con este estado.</p>
        </div>

        <div class="no-appointments-box glass-panel" th:if="${#lists.isEmpty(appointments)}">
            <i class="lucide-calendar-off" aria-hidden="true"></i>
            <p>Todavía no tienes citas. <a href="/centers">Busca un centro</a> y reserva tu primera cita.</p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética, salones y spas.')}"></div>

    <script>
        // Filtro por estado: usa data-status (valor del enum), no el texto visible de la etiqueta.
        document.querySelectorAll('[data-filter]').forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;
                document.querySelectorAll('[data-filter]').forEach(b => {
                    b.classList.toggle('active', b === button);
                    b.setAttribute('aria-pressed', String(b === button));
                });
                let visible = 0;
                document.querySelectorAll('.appointment-card').forEach(card => {
                    const show = filter === 'ALL' || card.dataset.status === filter;
                    card.hidden = !show;
                    if (show) visible++;
                });
                const empty = document.getElementById('noFilterResults');
                if (empty) empty.hidden = visible > 0 || !document.getElementById('appointmentsGrid');
            });
        });
    </script>
</body>
</html>
