<div xmlns:th="http://www.thymeleaf.org">
    <!-- Center Hero Banner Component -->
    <div class="center-hero-header glass-panel" th:fragment="hero(center)">
        <div class="center-photo center-hero-photo" th:if="${center.photoUrl != null}">
            <img th:src="${center.photoUrl}" th:alt="${'Foto de ' + center.name}" alt="Foto del centro">
        </div>
        <h1 class="hero-title" th:text="${center.name}">Nombre del Centro</h1>
        <a class="hero-rating" href="#resenas" th:if="${rating != null and rating.hasReviews()}"
           th:attr="aria-label=${'Nota media ' + rating.averageLabel() + ' de 5, ' + rating.countLabel() + '. Ver opiniones'}">
            <span th:replace="~{fragments/reviews :: stars(${rating.roundedToHalf()})}"></span>
            <strong th:text="${rating.averageLabel()}">4,7</strong>
            <span th:text="${'· ' + rating.countLabel()}">· 23 reseñas</span>
        </a>
        <a class="hero-rating hero-rating--empty" href="#resenas" th:if="${rating != null and !rating.hasReviews()}"
           aria-label="Sin valoraciones todavía. Ver opiniones">
            <span th:replace="~{fragments/reviews :: stars(0)}"></span>
            <span>Sin valoraciones todavía</span>
        </a>
        <div class="hero-meta-container">
            <div class="hero-meta-item">
                <i class="lucide-map-pin" aria-hidden="true"></i>
                <div>
                    <span class="hero-meta-label">Dirección:</span>
                    <span class="hero-meta-value" th:text="${center.address}">Dirección</span>
                </div>
            </div>
            <div class="hero-meta-item">
                <i class="lucide-phone" aria-hidden="true"></i>
                <div>
                    <span class="hero-meta-label">Teléfono:</span>
                    <span class="hero-meta-value"><th:block th:replace="~{fragments/tel :: link(${center.phone})}"></th:block></span>
                </div>
            </div>
            <div class="hero-meta-item">
                <i class="lucide-mail" aria-hidden="true"></i>
                <div>
                    <span class="hero-meta-label">Email:</span>
                    <span class="hero-meta-value" th:text="${center.email}">Email</span>
                </div>
            </div>
            <div class="hero-meta-item">
                <i class="lucide-clock" aria-hidden="true"></i>
                <div>
                    <span class="hero-meta-label">Horario:</span>
                    <span class="hero-meta-value hero-meta-lines"><th:block th:each="line : ${openingHoursLines}"><span th:text="${line}">Lunes a viernes: 09:00 - 20:00</span></th:block></span>
                </div>
            </div>
        </div>
        <div class="hero-actions" th:if="${center.directionsUrl != null or centerSlug != null}">
            <!--/* «Cómo llegar»: abre la ruta en Google Maps; en iPhone, iPad y Mac app.js deja elegir Apple Maps o Google Maps */-->
            <a class="btn btn-primary hero-directions" th:if="${center.directionsUrl != null}"
               th:href="${center.directionsUrl}" target="_blank" rel="noopener noreferrer"
               th:attr="data-directions=${center.address},data-apple-maps-url=${center.appleMapsUrl}">
                <i class="lucide-navigation" aria-hidden="true"></i> <span>Cómo llegar</span>
            </a>
            <button type="button" class="btn btn-secondary hero-share" th:if="${centerSlug != null}"
                    th:attr="data-share-path=@{/c/{s}(s=${centerSlug})},data-share-title=${center.name}">
                <i class="lucide-share-2" aria-hidden="true"></i> <span>Compartir</span>
            </button>
        </div>
        <p class="hero-share-status" role="status" aria-live="polite"></p>
    </div>
</div>
