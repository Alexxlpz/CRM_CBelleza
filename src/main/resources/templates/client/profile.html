<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Mi Perfil - Cuquora CRM')}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <main class="main-container settings-page settings-page--narrow">
        <header class="settings-header">
            <div>
                <h1>Mi Perfil</h1>
                <p>Gestiona tus datos personales y credenciales de acceso a Cuquora</p>
            </div>
        </header>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <section class="settings-card">
            <form th:action="@{/client/profile}" method="post">
                <h2 class="settings-section-title"><i class="lucide-badge-check" aria-hidden="true"></i> Datos Personales</h2>
                <div class="settings-grid">
                    <div>
                        <label for="name" class="form-label">Nombre Completo</label>
                        <input type="text" id="name" name="name" class="form-control" th:value="${client.name}" required autocomplete="name">
                    </div>
                    <div>
                        <label for="phone" class="form-label">Teléfono de Contacto</label>
                        <input type="tel" id="phone" name="phone" class="form-control" th:value="${client.phone}" placeholder="Ej: 612 345 678" autocomplete="tel">
                    </div>
                    <div class="span-full">
                        <label for="email" class="form-label">Correo Electrónico (Identificador)</label>
                        <input type="email" id="email" class="form-control" th:value="${client.email}" disabled aria-describedby="emailHint">
                    <span class="form-hint" id="emailHint">El correo electrónico es el identificador principal de tu cuenta y no puede modificarse directamente.</span>
                    </div>
                </div>

                <div class="settings-section">
                    <h2 class="settings-section-title"><i class="lucide-key-round" aria-hidden="true"></i> Cambiar Contraseña <span class="settings-optional">(Opcional)</span></h2>
                    <p class="settings-section-text">Déjalo en blanco si no deseas cambiar tu contraseña actual.</p>
                    <div class="settings-grid">
                    <div>
                        <label for="newPassword" class="form-label">Nueva Contraseña</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    </div>
                    <div>
                        <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite la contraseña" autocomplete="new-password">
                    </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <a href="/centers" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="lucide-save" aria-hidden="true"></i> Guardar Cambios</button>
                </div>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Todos los derechos reservados.')}"></div>
</body>
</html>
