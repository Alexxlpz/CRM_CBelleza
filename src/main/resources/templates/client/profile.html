<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Cuquora CRM</title>
    <!-- Lucide Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/cliente.css">
</head>
<body class="landing-page-view">
    <!-- Generic Global Navbar -->
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <!-- Main Container -->
    <main class="main-container" style="max-width: 860px; margin: 0 auto; padding-top: 36px; padding-bottom: 60px;">
        
        <!-- Header -->
        <div class="page-header" style="text-align: left; margin-bottom: 24px;">
            <h1 style="font-size: 26px; margin: 0; font-weight: 800; color: var(--text-main);">Mi Perfil</h1>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 14.5px;">Gestiona tus datos personales y credenciales de acceso a Cuquora</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${successMessage != null}" style="background: rgba(46, 125, 50, 0.1); border: 1px solid rgba(46, 125, 50, 0.3); border-radius: 14px; padding: 14px 20px; color: #2e7d32; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <i class="lucide-check-circle-2"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage != null}" style="background: rgba(211, 47, 47, 0.1); border: 1px solid rgba(211, 47, 47, 0.3); border-radius: 14px; padding: 14px 20px; color: #d32f2f; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
            <i class="lucide-alert-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Profile Form Card -->
        <div class="glass-panel" style="background: #ffffff; border: 1px solid rgba(197, 168, 128, 0.35); border-radius: 20px; padding: 32px 36px; box-shadow: 0 8px 30px rgba(197, 168, 128, 0.08);">
            <form action="/client/profile" method="POST">
                
                <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <i class="lucide-badge-check" style="color: var(--primary-dark);"></i> Datos Personales
                </h3>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
                    <div>
                        <label for="name" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Nombre Completo</label>
                        <input type="text" id="name" name="name" class="form-control" th:value="${client.name}" required
                               style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                    </div>

                    <div>
                        <label for="phone" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Teléfono de Contacto</label>
                        <input type="tel" id="phone" name="phone" class="form-control" th:value="${client.phone}" placeholder="Ej: 612 345 678"
                               style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                    </div>

                    <div style="grid-column: 1 / -1;">
                        <label for="email" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Correo Electrónico (Identificador)</label>
                        <input type="email" id="email" class="form-control" th:value="${client.email}" disabled
                               style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px; background: #fbf9f6; color: var(--text-muted); cursor: not-allowed;">
                        <span style="font-size: 12px; color: var(--text-muted); margin-top: 4px; display: block;">El correo electrónico es el identificador principal de tu cuenta y no puede modificarse directamente.</span>
                    </div>
                </div>

                <div style="border-top: 1px dashed rgba(197, 168, 128, 0.35); padding-top: 24px; margin-bottom: 28px;">
                    <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                        <i class="lucide-key-round" style="color: var(--primary-dark);"></i> Cambiar Contraseña <span style="font-size: 12px; font-weight: 500; color: var(--text-muted);">(Opcional)</span>
                    </h3>
                    <p style="font-size: 13.5px; color: var(--text-muted); margin-bottom: 16px;">Déjalo en blanco si no deseas cambiar tu contraseña actual.</p>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                        <div>
                            <label for="newPassword" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Nueva Contraseña</label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Mínimo 6 caracteres"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>

                        <div>
                            <label for="confirmPassword" style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">Confirmar Nueva Contraseña</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite la contraseña"
                                   style="width: 100%; height: 44px; padding: 0 16px; border: 1px solid #ebdccb; border-radius: 12px; font-family: inherit; font-size: 14.5px;">
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 14px;">
                    <a href="/centers" class="nav-auth-btn nav-auth-register" style="height: 42px; padding: 0 22px;">Cancelar</a>
                    <button type="submit" class="nav-auth-btn nav-auth-login" style="height: 42px; padding: 0 26px; border: none; cursor: pointer; font-size: 14px;">
                        <i class="lucide-save" style="margin-right: 6px;"></i> Guardar Cambios
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Todos los derechos reservados.')}"></div>
</body>
</html>
