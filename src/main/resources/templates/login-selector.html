<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Selector de Perfiles (Desarrollo) - Cuquora CRM')}"></th:block>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
    <div th:replace="~{fragments/navbar :: brand(false)}"></div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Selector de perfiles</h1>
                <p>Modo desarrollo: selecciona un usuario para entrar directamente, sin contraseña.</p>
            </div>

            <form th:action="@{/select-session}" method="post">
                <div class="form-group">
                    <label class="form-label" for="profileSelector">Seleccionar usuario</label>
                    <select id="profileSelector" name="userId" class="form-control" required>
                        <option value="" disabled selected>Elige un perfil para continuar...</option>
                        <optgroup label="Clientes">
                            <option th:each="client : ${clients}" th:value="${client.id}"
                                    th:text="${client.name}">Sofía Martínez</option>
                        </optgroup>
                        <optgroup label="Personal de los centros">
                            <option th:each="worker : ${workers}" th:value="${worker.id}"
                                    th:text="${worker.name} + (${worker.center != null} ? ' — ' + ${worker.center.name} : '')">
                                Carlos Mendoza — Centro Histórico
                            </option>
                        </optgroup>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="lucide-log-in" aria-hidden="true"></i>
                    <span>Entrar con el perfil seleccionado</span>
                </button>
            </form>

            <div class="auth-footer-links">
                <p><a href="/login">← Volver al inicio de sesión con credenciales</a></p>
            </div>

            <div class="auth-trust-row">
                <span><i class="lucide-shield-alert" aria-hidden="true"></i> Solo disponible con el perfil "dev"</span>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Entorno de desarrollo.')}"></div>
</body>
</html>
