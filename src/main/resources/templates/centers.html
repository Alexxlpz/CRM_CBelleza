<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Nuestros Centros de Belleza - Cuquora CRM')}"></th:block>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <link rel="stylesheet" th:href="@{/css/cliente.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <main class="main-container">
        <div class="page-header">
            <h1>Nuestros Centros de Belleza</h1>
            <p>Elige el salón más conveniente y agenda tu experiencia de lujo</p>
        </div>

        <div th:replace="~{fragments/alerts :: flash}"></div>

        <!-- Buscador -->
        <div class="filter-search-bar filter-search-container glass-panel" role="search">
            <div class="filter-search-row">
                <label for="searchName" class="visually-hidden">Buscar centro</label>
                <input type="search" id="searchName" class="form-control search-input-flex" placeholder="Buscar centro..." autocomplete="off">

                <button type="button" class="btn btn-secondary filter-button filter-icon-btn" id="btnAdvSearch"
                        aria-label="Filtros avanzados" aria-expanded="false" aria-controls="advancedSearchPanel">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                    <span id="treatmentBadge" class="bell-badge" aria-hidden="true"></span>
                </button>
                <button type="button" class="btn btn-secondary filter-icon-btn" id="btnMapToggle" aria-label="Ver en mapa" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                </button>
                <button type="button" class="btn btn-primary filter-icon-btn" id="btnSearch" aria-label="Buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

            <div id="advancedSearchPanel" class="advanced-search-panel">
                <div class="advanced-search-fields">
                    <div class="advanced-search-field">
                        <label class="form-label advanced-search-label" for="searchTreatment">Tipo de Tratamiento</label>
                        <select id="searchTreatment" class="form-control">
                            <option value="">Cualquier tipo</option>
                            <option value="MANICURA_PEDICURA">Manicura y Pedicura</option>
                            <option value="FACIAL">Tratamientos Faciales</option>
                            <option value="CORPORAL">Tratamientos Corporales</option>
                            <option value="MASAJES">Masajes</option>
                            <option value="PELUQUERIA">Peluquería</option>
                            <option value="DEPILACION">Depilación</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="mapContainer" class="map-container" aria-label="Mapa de centros"></div>

        <div class="centers-grid" id="centersGrid" aria-live="polite"></div>

        <div id="infiniteScrollTrigger" class="infinite-scroll-trigger">
            <i class="lucide-loader spin" aria-hidden="true"></i> Cargando centros cercanos...
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética, salones y spas.')}"></div>

    <script th:inline="javascript">
        const currentSessionRole = /*[[${sessionRole}]]*/ null;

        document.addEventListener('DOMContentLoaded', () => {
            const esc = Cuquora.escapeHtml;
            const PAGE_SIZE = 10;

            const centersGrid = document.getElementById('centersGrid');
            const trigger = document.getElementById('infiniteScrollTrigger');
            const mapContainer = document.getElementById('mapContainer');
            const btnMapToggle = document.getElementById('btnMapToggle');
            const btnAdvSearch = document.getElementById('btnAdvSearch');
            const advancedPanel = document.getElementById('advancedSearchPanel');
            const treatmentBadge = document.getElementById('treatmentBadge');
            const searchName = document.getElementById('searchName');
            const searchTreatment = document.getElementById('searchTreatment');

            let userLat = null;
            let userLon = null;
            let currentPage = 0;
            let isLoading = false;
            let hasMore = true;
            let isMapView = false;
            let map = null;
            let mapMarkers = [];
            let firstLoadDone = false;

            /* ---- Acceso a un centro ---- */
            /*
             * Acceso a la ficha de un centro (/client/centers/{id}):
             *  - Trabajador: no puede consultar otros centros → aviso y no se navega.
             *  - Sin sesión: se navega igualmente; el servidor redirige al inicio de sesión
             *    y, tras entrar, devuelve al usuario al centro que eligió.
             *  - Cliente: navega directamente.
             */
            const centerUrl = center => `/client/centers/${encodeURIComponent(center.id)}`;

            async function showWorkerRestriction() {
                const goToPanel = await Cuquora.confirm(
                    'Has iniciado sesión como trabajador y un trabajador no puede consultar otros centros. Para reservar una cita, entra con una cuenta de cliente.',
                    { title: 'Acceso no disponible', confirmText: 'Ir a mi panel', cancelText: 'Entendido', tone: 'default' });
                if (goToPanel) window.location.href = '/worker/dashboard';
            }

            /** Desde el mapa se confirma antes de salir, porque un toque en un marcador es fácil de hacer sin querer. */
            async function openCenterFromMap(center) {
                if (currentSessionRole === 'WORKER') {
                    showWorkerRestriction();
                    return;
                }
                const message = currentSessionRole
                    ? '¿Quieres ver los tratamientos y reservar en ' + center.name + '?'
                    : '¿Quieres ver los tratamientos de ' + center.name + '? Te pediremos que inicies sesión para continuar.';
                if (await Cuquora.confirm(message, { title: 'Acceder al centro', confirmText: 'Continuar', tone: 'default' })) {
                    window.location.href = centerUrl(center);
                }
            }

            /* ---- Filtros ---- */
            btnAdvSearch.addEventListener('click', () => {
                const open = advancedPanel.classList.toggle('is-open');
                btnAdvSearch.classList.toggle('is-active', open);
                btnAdvSearch.setAttribute('aria-expanded', String(open));
            });

            btnMapToggle.addEventListener('click', () => {
                isMapView = !isMapView;
                btnMapToggle.classList.toggle('is-active', isMapView);
                btnMapToggle.setAttribute('aria-pressed', String(isMapView));
                mapContainer.classList.toggle('is-visible', isMapView);
                centersGrid.hidden = isMapView;
                trigger.hidden = isMapView || !hasMore;
                if (isMapView) initMap(); else resetAndFetch();
            });

            document.getElementById('btnSearch').addEventListener('click', resetAndFetch);

            let searchTimeout;
            searchName.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(resetAndFetch, 400);
            });
            searchTreatment.addEventListener('change', () => {
                treatmentBadge.classList.toggle('is-visible', searchTreatment.value !== '');
                resetAndFetch();
            });

            function filterParams(extra) {
                const params = new URLSearchParams(extra);
                if (searchName.value) params.append('searchName', searchName.value);
                if (searchTreatment.value) params.append('searchTreatment', searchTreatment.value);
                return params;
            }

            /* ---- Mapa ---- */
            const markerIcon = color => L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41]
            });

            function initMap() {
                if (map) {
                    map.invalidateSize();
                    fetchMapCenters();
                    return;
                }
                map = L.map('mapContainer').setView([userLat || 40.4168, userLon || -3.7038], 12);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                    maxZoom: 19
                }).addTo(map);
                if (userLat && userLon) {
                    L.marker([userLat, userLon], { icon: markerIcon('blue') }).addTo(map).bindPopup('Tu ubicación');
                }
                map.on('moveend', fetchMapCenters);
                fetchMapCenters();
            }

            async function fetchMapCenters() {
                if (!map) return;
                const b = map.getBounds();
                const params = filterParams({ north: b.getNorth(), south: b.getSouth(), east: b.getEast(), west: b.getWest() });
                try {
                    const centers = await (await fetch('/api/centers?' + params)).json();
                    mapMarkers.forEach(m => map.removeLayer(m));
                    mapMarkers = centers
                        .filter(c => c.latitude && c.longitude)
                        .map(center => {
                            const marker = L.marker([center.latitude, center.longitude], { icon: markerIcon('gold'), title: center.name }).addTo(map);
                            marker.on('click', () => openCenterFromMap(center));
                            return marker;
                        });
                } catch (e) {
                    console.error('Error al cargar los centros del mapa', e);
                }
            }

            /* ---- Listado con scroll infinito ---- */
            function resetAndFetch() {
                if (isMapView) {
                    fetchMapCenters();
                    return;
                }
                currentPage = 0;
                hasMore = true;
                centersGrid.innerHTML = '';
                trigger.hidden = false;
                fetchCenters();
            }

            function centerCard(center) {
                const card = document.createElement('article');
                card.className = 'center-card glass-panel';
                const distance = center.distanceKm !== null
                    ? `<span class="center-distance-badge">A ${center.distanceKm.toFixed(1)} km</span>`
                    : '<i class="lucide-map-pin center-meta-icon" aria-hidden="true"></i>';
                const meta = (icon, label, value) => `
                    <div class="center-meta-item align-start">
                        <i class="lucide-${icon} center-meta-icon" aria-hidden="true"></i>
                        <div>
                            <span class="center-meta-title">${label}</span>
                            <span>${esc(value || 'N/A')}</span>
                        </div>
                    </div>`;
                card.innerHTML = `
                    <div class="center-card-header">
                        <h2 class="center-card-title">${esc(center.name)}</h2>
                        ${distance}
                    </div>
                    <div class="center-card-body">
                        ${meta('navigation', 'Dirección:', center.address)}
                        ${meta('phone', 'Número de teléfono:', center.phone)}
                        ${meta('mail', 'Dirección email:', center.email)}
                    </div>
                    <div class="center-card-footer">
                        <a href="/client/centers/${encodeURIComponent(center.id)}" class="btn btn-primary center-select-btn">
                            <i class="lucide-calendar-plus" aria-hidden="true"></i> Ver Tratamientos y Reservar
                        </a>
                    </div>`;
                // El enlace navega de forma normal (también con Ctrl/clic central); solo se intercepta para trabajadores.
                card.querySelector('a').addEventListener('click', e => {
                    if (currentSessionRole === 'WORKER') {
                        e.preventDefault();
                        showWorkerRestriction();
                    }
                });
                return card;
            }

            async function fetchCenters() {
                if (isLoading || !hasMore) return;
                isLoading = true;
                const params = filterParams({ page: currentPage, size: PAGE_SIZE });
                if (userLat) params.append('lat', userLat);
                if (userLon) params.append('lon', userLon);
                try {
                    const centers = await (await fetch('/api/centers?' + params)).json();
                    if (centers.length < PAGE_SIZE) {
                        hasMore = false;
                        trigger.hidden = true;
                    }
                    if (centers.length === 0 && currentPage === 0) {
                        centersGrid.innerHTML = `
                            <div class="no-appointments-box glass-panel grid-col-full">
                                <i class="lucide-map-pin-off" aria-hidden="true"></i>
                                <p>No se encontraron centros de belleza que coincidan con tus criterios.</p>
                            </div>`;
                    }
                    centers.forEach(center => centersGrid.appendChild(centerCard(center)));
                    currentPage++;
                    firstLoadDone = true;
                } catch (err) {
                    console.error('Error al cargar los centros', err);
                } finally {
                    isLoading = false;
                }
            }

            new IntersectionObserver(entries => {
                if (entries[0].isIntersecting && hasMore && !isLoading && !isMapView && firstLoadDone) fetchCenters();
            }, { rootMargin: '100px' }).observe(trigger);

            // Primera carga: se intenta ordenar por cercanía; si no hay ubicación en 3 s, se carga sin ella.
            const fallback = setTimeout(() => { if (!firstLoadDone) resetAndFetch(); }, 3000);
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(pos => {
                    clearTimeout(fallback);
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    resetAndFetch();
                }, () => {
                    clearTimeout(fallback);
                    if (!firstLoadDone) resetAndFetch();
                });
            } else {
                clearTimeout(fallback);
                resetAndFetch();
            }
        });
    </script>
</body>
</html>
