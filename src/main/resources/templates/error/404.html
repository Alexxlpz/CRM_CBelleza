<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('Página no encontrada - Cuquora')}"></th:block>
    <meta name="robots" content="noindex">
</head>
<body>
    <div th:replace="~{fragments/navbar :: brand(true)}"></div>

    <!--/* Página 404 propia: la usa Spring Boot para cualquier dirección inexistente y
           GlobalExceptionHandler para los recursos que no existen o son de otro centro. */-->
    <main class="main-container error-page">
        <section class="error-card glass-panel not-found-card" aria-labelledby="notFoundTitle">
            <!--/* Ilustración animada: el niño se asoma al espejo del salón y en vez de su reflejo solo hay un 404
                   (colores de tokens.css, estilos y animaciones en common.css) */-->
            <svg class="not-found-art" viewBox="0 0 420 230" role="img"
                 aria-label="Un niño se asoma a un espejo de peluquería y, en lugar de su reflejo, solo aparece 404">
                <defs>
                    <clipPath id="nfMirrorGlass">
                        <path d="M232 164 V84 a50 50 0 0 1 100 0 V164 Z"/>
                    </clipPath>
                </defs>
                <line class="nf-floor" x1="16" y1="218" x2="404" y2="218"/>

                <!-- Tocador -->
                <line class="nf-leg" x1="216" y1="182" x2="216" y2="218"/>
                <line class="nf-leg" x1="372" y1="182" x2="372" y2="218"/>
                <rect class="nf-console" x="200" y="170" width="188" height="13" rx="5"/>
                <rect class="nf-bottle nf-bottle-1" x="344" y="144" width="13" height="26" rx="4"/>
                <rect class="nf-bottle-cap" x="347" y="137" width="7" height="8" rx="2"/>
                <rect class="nf-bottle nf-bottle-2" x="362" y="152" width="11" height="18" rx="4"/>
                <rect class="nf-bottle-cap" x="364" y="146" width="7" height="7" rx="2"/>

                <!-- Espejo: marco, cristal, brillo que lo recorre y el 404 en lugar del reflejo -->
                <path class="nf-mirror-frame" d="M222 170 V84 a60 60 0 0 1 120 0 V170 Z"/>
                <path class="nf-mirror-glass" d="M232 164 V84 a50 50 0 0 1 100 0 V164 Z"/>
                <g clip-path="url(#nfMirrorGlass)">
                    <g class="nf-mirror-shine">
                        <rect x="230" y="20" width="16" height="190" transform="rotate(24 238 115)"/>
                        <rect x="254" y="20" width="7" height="190" transform="rotate(24 257 115)"/>
                    </g>
                </g>
                <text class="nf-mirror-code" x="282" y="132" text-anchor="middle">404</text>
                <path class="nf-sparkle nf-sparkle-1" d="M352 50 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
                <path class="nf-sparkle nf-sparkle-2" d="M212 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>

                <!-- Niño que se asoma -->
                <g class="nf-kid">
                    <path class="nf-shirt" d="M70 218 V188 a32 32 0 0 1 32 -32 h12 a32 32 0 0 1 32 32 V218 Z"/>
                    <path class="nf-arm nf-arm-scratch" d="M84 168 Q58 146 70 112"/>
                    <circle class="nf-hand nf-hand-scratch" cx="71" cy="110" r="8"/>
                    <path class="nf-arm" d="M140 172 Q168 160 190 142"/>
                    <circle class="nf-hand" cx="194" cy="139" r="8"/>
                    <g class="nf-head">
                        <circle class="nf-skin" cx="108" cy="112" r="38"/>
                        <path class="nf-hair" d="M72 104 Q74 68 108 70 Q144 68 146 102 Q134 88 122 92 Q112 76 100 90 Q86 82 72 104Z"/>
                        <path class="nf-brow" d="M96 100 q7 -7 14 -2"/>
                        <path class="nf-brow" d="M121 100 h12"/>
                        <circle class="nf-pupil" cx="106" cy="114" r="4.5"/>
                        <circle class="nf-pupil" cx="130" cy="114" r="4.5"/>
                        <circle class="nf-mouth-o" cx="120" cy="134" r="5"/>
                        <circle class="nf-cheek" cx="90" cy="126" r="5"/>
                        <circle class="nf-cheek" cx="138" cy="126" r="5"/>
                    </g>
                    <text class="nf-question nf-question-1" x="150" y="66">?</text>
                    <text class="nf-question nf-question-2" x="168" y="46">?</text>
                </g>
            </svg>
            <h1 id="notFoundTitle">Ni rastro de esta página</h1>
            <p>No encontramos esta página. Puede que el enlace haya cambiado o que el contenido ya no exista. Sigue desde aquí:</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <i th:class="${sessionRole == 'WORKER'} ? 'lucide-layout-dashboard' : 'lucide-home'" aria-hidden="true"></i>
                    <span th:text="${sessionRole == 'WORKER'} ? 'Volver a mi panel' : 'Ir al inicio'">Ir al inicio</span>
                </a>
                <a href="/centers" class="btn btn-secondary" th:unless="${sessionRole == 'WORKER'}">
                    <i class="lucide-map-pin" aria-hidden="true"></i>
                    <span>Buscar centros</span>
                </a>
            </div>
            <p class="error-help">
                ¿Crees que es un error nuestro? <a href="/contact">Cuéntanoslo</a> y lo revisamos.
            </p>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer('© 2026 Cuquora CRM. Software de gestión para centros de estética, salones y spas.')}"></div>
</body>
</html>
