<!--/*
    <head> común a todas las páginas. Uso:
        <head>
            <th:block th:replace="~{fragments/head :: meta('Título de la página')}"></th:block>
            <link rel="stylesheet" href="/css/pagina.css">   <- estilos propios de la página
        </head>
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="meta(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">Cuquora</title>
    <!-- Token CSRF para las peticiones fetch (lo usa /js/app.js) -->
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/images/icon.png">
    <link rel="apple-touch-icon" href="/images/icon.png">
    <!-- Tipografía (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
    <!-- Iconos Lucide -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    <!-- Estilos base (tokens, componentes y layout comunes) -->
    <link rel="stylesheet" href="/css/common.css">
    <!-- Comportamiento común: CSRF en fetch, menú móvil, diálogos -->
    <script src="/js/app.js" defer></script>
</th:block>
