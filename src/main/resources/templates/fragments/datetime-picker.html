<div xmlns:th="http://www.thymeleaf.org">
    <!-- Calendario de la reserva: días del mes y horas libres del día elegido, siempre a la vista (booking-picker.js) -->
    <div th:fragment="picker" class="booking-picker" id="bookingPicker">
        <div class="booking-picker-panels">
            <section class="booking-calendar" aria-labelledby="calendarMonth">
                <header class="booking-calendar-head">
                    <button type="button" class="booking-calendar-nav" id="previousMonth" aria-label="Mes anterior">
                        <i class="lucide-chevron-left" aria-hidden="true"></i>
                    </button>
                    <h3 class="booking-calendar-month" id="calendarMonth" aria-live="polite">Octubre 2026</h3>
                    <button type="button" class="booking-calendar-nav" id="nextMonth" aria-label="Mes siguiente">
                        <i class="lucide-chevron-right" aria-hidden="true"></i>
                    </button>
                </header>
                <div class="booking-calendar-weekdays" aria-hidden="true">
                    <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
                </div>
                <div class="booking-calendar-days" id="calendarDays"></div>
                <ul class="booking-calendar-legend">
                    <li><span class="legend-swatch legend-swatch--free" aria-hidden="true"></span> Con horas libres</li>
                    <li><span class="legend-swatch legend-swatch--full" aria-hidden="true"></span> Completo</li>
                    <li><span class="legend-swatch legend-swatch--closed" aria-hidden="true"></span> Cerrado</li>
                </ul>
            </section>

            <section class="booking-times" aria-labelledby="bookingTimesTitle">
                <h3 class="booking-times-title" id="bookingTimesTitle">Horas libres</h3>
                <div class="booking-times-body" id="timeOptions">
                    <p class="booking-times-hint">Elige un día para ver las horas libres.</p>
                </div>
            </section>
        </div>

        <p class="booking-picker-message" id="availabilityMessage" role="status"></p>
        <input type="hidden" name="dateTime" id="dateTime" required>
    </div>
</div>
