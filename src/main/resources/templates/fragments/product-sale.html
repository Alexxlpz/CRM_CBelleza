<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Vender un producto del inventario a un cliente. La previsión de stock la calcula product-sale.js,
       que también busca el producto por su código de barras (cámara o lector) o por su nombre.
       Desde la ficha llega el cliente (clients nulo); desde el inventario, la cartera para elegirlo (client nulo). */-->
<div th:fragment="modal(client, clients, items, loyalty)" class="ui-modal-overlay" id="productSaleModal" hidden>
    <div class="ui-modal ui-modal--form" role="dialog" aria-modal="true" aria-labelledby="productSaleTitle">
        <button type="button" class="ui-modal-close" data-modal-close aria-label="Cerrar"><i class="lucide-x" aria-hidden="true"></i></button>
        <h2 class="ui-modal-title" id="productSaleTitle"><i class="lucide-shopping-bag" aria-hidden="true"></i> Vender producto</h2>
        <p class="ui-modal-text" th:text="${client != null} ? 'Se resta del inventario del centro y queda en el historial de ' + ${client.name} + '.'
                                                         : 'Se resta del inventario del centro y queda en el historial del cliente.'">Se resta del inventario del centro.</p>
        <form th:action="@{${client != null ? '/worker/clients/' + client.id + '/sales' : '/worker/inventory/sales'}}"
              method="post" id="productSaleForm" class="sale-form"
              th:data-loyalty-mode="${loyalty.enabled()} ? ${loyalty.mode().name()} : 'OFF'"
              th:data-loyalty-per-unit="${loyalty.pointsPerUnit()}">
            <th:block th:if="${client == null}">
                <label class="form-label" for="saleClientId">Cliente</label>
                <select id="saleClientId" name="clientId" class="form-control">
                    <option value="">Elige un cliente</option>
                    <option th:each="c : ${clients}" th:value="${c.id}"
                            th:text="${c.phone != null and !#strings.isEmpty(c.phone)} ? ${c.name} + ' · ' + ${c.phone} : ${c.name}">Sofía Martínez · 600 123 456</option>
                </select>
            </th:block>

            <!--/* Buscar el producto: cámara (barcode-camera.js), lector USB o parte del nombre. Filtra la lista de abajo. */-->
            <div class="sale-scan" data-sale-scan>
                <label class="form-label" for="saleSearch">Producto</label>
                <div class="barcode-row">
                    <input type="search" id="saleSearch" class="form-control" autocomplete="off" enterkeyhint="search"
                           placeholder="Código o nombre" aria-describedby="saleScanStatus">
                    <button type="button" class="btn btn-secondary barcode-btn" data-sale-scan-start>
                        <i class="lucide-scan-barcode" aria-hidden="true"></i> <span>Escanear</span>
                    </button>
                </div>
                <div class="barcode-camera" data-sale-camera hidden>
                    <video muted playsinline aria-label="Cámara para leer el código de barras"></video>
                    <span class="barcode-camera-guide" aria-hidden="true"></span>
                    <button type="button" class="btn btn-secondary btn-sm barcode-camera-close" data-sale-scan-stop tabindex="-1">Cancelar</button>
                </div>
                <p class="form-help" id="saleScanStatus" role="status" aria-live="polite" data-sale-scan-status>
                    Usa la cámara, un lector de códigos o búscalo por su nombre.
                </p>
            </div>

            <select id="saleInventoryId" name="inventoryId" class="form-control" aria-label="Producto que se vende">
                <option value="">Elige un producto</option>
                <option th:each="item : ${items}" th:value="${item.id}" th:disabled="${item.stock == 0}"
                        th:data-barcode="${item.product.barcode}" th:data-name="${item.product.name}"
                        th:data-stock="${item.stock}" th:data-price="${item.product.price}"
                        th:text="${item.product.name} + ' · ' + (${item.stock == 0} ? 'agotado' : ${item.stock} + ' en stock')">Sérum vitamina C · 5 en stock</option>
            </select>

            <label class="form-label" for="saleQuantity">Cantidad</label>
            <input type="number" id="saleQuantity" name="quantity" class="form-control" value="1" min="1" max="99" step="1" required>

            <div class="sale-preview" id="salePreview" aria-live="polite" hidden>
                <dl class="sale-preview-grid">
                    <dt>Stock</dt>
                    <dd><span id="saleStockNow">5</span> <i class="lucide-arrow-right" aria-hidden="true"></i> <strong id="saleStockAfter">3</strong> unidades</dd>
                    <dt>Total</dt>
                    <dd><strong id="saleTotal">25,00 €</strong></dd>
                    <dt th:if="${loyalty.enabled()}">Puntos</dt>
                    <dd th:if="${loyalty.enabled()}"><strong id="salePoints">+25</strong></dd>
                </dl>
                <p class="sale-stock-warning" id="saleStockWarning" hidden>
                    <i class="lucide-alert-triangle" aria-hidden="true"></i> <span></span>
                </p>
            </div>
            <p class="agenda-form-error" id="saleError" role="alert" hidden></p>

            <div class="ui-modal-actions">
                <button type="button" class="btn btn-secondary" data-modal-close tabindex="-1">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="saleSubmit"><i class="lucide-check" aria-hidden="true"></i> Confirmar venta</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
