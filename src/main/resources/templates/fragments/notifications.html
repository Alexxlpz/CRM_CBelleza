<div xmlns:th="http://www.thymeleaf.org">
    <div class="notifications-container" th:fragment="menu(items)">
        <button type="button" class="bell-btn" onclick="toggleNotifications(event)" aria-label="Ver notificaciones">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                 stroke-linejoin="round" class="lucide-bell-svg"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
            <span class="bell-badge" th:if="${not #lists.isEmpty(items)}" th:text="${#lists.size(items)}">0</span>
        </button>
        <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notifications-header">Notificaciones de Gestión</div>
            <div class="notifications-body">
                <a class="notification-item" th:each="notification : ${items}"
                   th:href="${notification.url}">
                    <i class="lucide-alert-circle"></i>
                    <span th:text="${notification.message}">Alerta de prueba</span>
                </a>
                <div class="notification-empty" th:if="${#lists.isEmpty(items)}">
                    <i class="lucide-bell-off"></i>
                    <span>No hay notificaciones activas</span>
                </div>
            </div>
        </div>
        <script>
            function toggleNotifications(event) {
                event.stopPropagation();
                const dropdown = document.getElementById('notificationsDropdown');
                dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
            }

            document.addEventListener('click', function(event) {
                const dropdown = document.getElementById('notificationsDropdown');
                if (dropdown && !event.target.closest('.notifications-container')) {
                    dropdown.style.display = 'none';
                }
            });
        </script>
    </div>
</div>
