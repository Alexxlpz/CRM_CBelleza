<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout('¡Hola!', 'Hemos recibido tu consulta', ~{::content})}">
<body>
<th:block th:fragment="content">
    <p style="font-size:15px; color:#5c5550; line-height:1.6; margin:0 0 20px;">
        Gracias por ponerte en contacto con el equipo de <strong>Cuquora</strong>. Un miembro del equipo te responderá a la mayor brevedad posible.
    </p>
    <!--/* Texto fijo, sin nada de lo que escribió el remitente: el formulario es público y cualquiera puede poner
           el correo de otra persona, así que el acuse no puede servir para hacerle llegar un mensaje. */-->
    <p style="font-size:13px; color:#857b74; margin:0;">Recibido el <span th:text="${timestamp}">fecha</span>. Si no has escrito tú a Cuquora, ignora este correo.</p>
</th:block>
</body>
</html>
