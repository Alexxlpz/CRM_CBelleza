<!DOCTYPE html>
<!--/* Estructura común de los correos. Los estilos van en línea porque los clientes de correo ignoran <style>. */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(heading, subtitle, content)">
<head><meta charset="UTF-8"><title th:text="${heading}">Cuquora</title></head>
<body style="margin:0; padding:24px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#f9f7f5; color:#2b2825;">
<div style="max-width:620px; margin:0 auto; background:#ffffff; border:1px solid #e7ded5; border-radius:16px; padding:32px; box-shadow:0 8px 24px rgba(40,32,25,0.06);">
    <div style="border-bottom:2px solid #c5a880; padding-bottom:16px; margin-bottom:24px;">
        <p style="margin:0 0 4px; color:#a87d4f; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Cuquora</p>
        <h2 style="margin:0; color:#2b2825; font-size:21px;" th:text="${heading}">Título</h2>
        <span style="font-size:13px; color:#857b74;" th:text="${subtitle}">Subtítulo</span>
    </div>
    <th:block th:replace="${content}"></th:block>
</div>
</body>
</html>
