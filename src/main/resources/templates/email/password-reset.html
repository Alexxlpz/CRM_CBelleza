<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout('Hola, ' + ${name}, 'Cambia tu contraseña de Cuquora', ~{::content})}">
<body>
<th:block th:fragment="content">
    <p style="font-size:15px; color:#5c5550; line-height:1.6; margin:0 0 16px;">
        Alguien ha pedido cambiar la contraseña de tu cuenta de Cuquora. Si has sido tú, pulsa el botón y escribe la nueva.
    </p>
    <p style="margin:0 0 20px;">
        <a th:href="${resetUrl}" style="display:inline-block; padding:12px 22px; background:#8a6a45; color:#ffffff; text-decoration:none; border-radius:10px; font-weight:700; font-size:14px;">Poner una contraseña nueva</a>
    </p>
    <p style="font-size:13px; color:#857b74; margin:0;">
        El enlace vale <span th:text="${validityMinutes}">60</span> minutos y sirve una sola vez.
        Si no has sido tú, ignora este correo: tu contraseña no cambia y nadie puede entrar sin este enlace.
    </p>
</th:block>
</body>
</html>
