# Perfil de producción: docker-compose lo activa (SPRING_PROFILES_ACTIVE=prod).
# Se suma a application.properties y solo cambia lo que en producción tiene que ser distinto.
# Al arrancar, ProductionChecks revisa el .env y no deja arrancar si falta algo imprescindible (SITE_URL con https,
# REMEMBER_ME_KEY, PostgreSQL, cuentas demo apagadas…).

# --- HTTPS detrás de Cloudflare ---
# Cookies de sesión solo por HTTPS y la app sabe que la visita llegó cifrada (HSTS, «Recordar mi sesión» segura)
# y cuál es la IP real del visitante. Se pueden cambiar en el .env, pero ProductionChecks exige COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# --- Páginas de error ---
# Nunca enseñar al visitante trazas, nombres de clases ni mensajes internos: solo la página error.html propia
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-path=never
spring.web.error.whitelabel.enabled=false

# --- Rendimiento ---
# HTML, CSS y JS comprimidos (Cloudflare también comprime; esto cubre el tramo hasta Cloudflare)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/xml,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1KB
# El navegador guarda CSS, JS, imágenes, iconos y fuentes un día en vez de pedirlos en cada página.
# CSS y JS llevan un hash en el nombre, así que un cambio llega al momento; un icono cambiado, como mucho al día siguiente.
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true
# Al parar el contenedor se terminan las peticiones en curso (como mucho 20 s) en vez de cortarlas
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Base de datos ---
# Flyway nunca puede vaciar la base de datos y comprueba que las migraciones ya aplicadas no han cambiado
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# --- Logs (docker compose logs app) ---
# Solo lo importante: avisos, errores y el arranque. Docker los guarda con tope de tamaño (docker-compose.yml).
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.springframework.security=WARN
# Fechas de los logs en la hora del servidor (TZ=Europe/Madrid), más fáciles de cruzar con las citas
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
