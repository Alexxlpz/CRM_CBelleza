spring.application.name=CRM_CBelleza

# SQL Database Configuration
# Defaults to H2 for local development; Docker Compose overrides these values for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:crm_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo comprueba que coincide
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Al parar la app (o al reiniciarla devtools) se espera a que acaben las tareas programadas antes de cerrar la BD
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s

# H2 Console: desactivada por defecto (se activa con el perfil "dev")
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false

# --- Alternative MySQL Configuration (Uncomment to use) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/crm_cbelleza?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# (requiere también la dependencia org.flywaydb:flyway-mysql)

# --- Email Configuration (SMTP) ---
# Default empty host activates local console simulation fallback.
# Provide environment variables (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD) for real email delivery.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cuquora Contact & Registration Mail Settings
crm.mail.admin-email=${CRM_ADMIN_EMAIL:cuquora@hotmail.com}
crm.mail.from-email=${CRM_FROM_EMAIL:cuquora@hotmail.com}
# Correos de citas a clientes por centro y día, recordatorios incluidos (AppointmentMailService.DailyQuota): Brevo gratis
# da 300 al día para toda la web y un centro no puede gastarlos todos.
crm.mail.max-client-emails-per-center-per-day=150

# Dirección pública del sitio (p. ej. https://cuquora.com) para las etiquetas Open Graph.
# Vacía = se toma de la petición (detrás de Cloudflare requiere server.forward-headers-strategy=native).
# La web solo está en español: fechas («miércoles 15») y formatos siempre en español, sea cual sea el navegador
spring.web.locale=es_ES
spring.web.locale-resolver=fixed
crm.site-url=${SITE_URL:}
# Titular de la web para las páginas legales (LSSI): nombre o razón social, NIF y domicilio
crm.legal.owner-name=${LEGAL_OWNER_NAME:}
crm.legal.owner-nif=${LEGAL_OWNER_NIF:}
crm.legal.owner-address=${LEGAL_OWNER_ADDRESS:}

# Datos de demostración (DatabaseSeeder): desactivados salvo en el perfil "dev", los tests o SEED_DEMO_DATA=true.
# Sus cuentas usan la contraseña pública "Cuquora2026!" (DatabaseSeeder.DEMO_PASSWORD): no activar nunca en producción.
crm.seed-demo-data=${SEED_DEMO_DATA:false}

# --- Seguridad ---
# La sesión viaja solo en cookie, nunca como ;jsessionid=… en la URL (en las páginas de error rompía los CSS)
server.servlet.session.tracking-modes=cookie
# Cookies de sesión: nunca legibles desde JavaScript ni enviadas desde otras webs al pulsar un formulario (SameSite=Lax).
# Con HTTPS (Cloudflare) poner COOKIE_SECURE=true para que solo viajen cifradas; en local por http:// se deja en false.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Detrás de Cloudflare: native = la app usa la IP real del visitante (freno del login y de los formularios) y sabe que la
# petición llegó por HTTPS (cookies «Recordar mi sesión» seguras y cabecera HSTS). Solo si el puerto 8080 NO está abierto
# a internet (docker-compose lo publica en 127.0.0.1): si no, cualquiera podría inventarse la IP con X-Forwarded-For.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Formularios públicos que crean cuentas o envían correos: envíos por IP y hora (PublicFormLimiter)
crm.security.form-limits.contact=5
crm.security.form-limits.center-registration=5
crm.security.form-limits.registration=10
# Clave para firmar la cookie "Recordar mi sesión". Si se deja vacía se genera una aleatoria en cada arranque.
crm.security.remember-me-key=${REMEMBER_ME_KEY:}
# «Iniciar sesión con Google»: credenciales OAuth del proyecto de Google Cloud (tipo «Aplicación web»).
# URI de redirección autorizada: <dirección pública>/login/oauth2/code/google. Vacías = sin botón de Google.
crm.security.google.client-id=${GOOGLE_CLIENT_ID:}
crm.security.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Sincronización de citas con Google Calendar (interruptor en «Mi Centro»): usa el mismo ID de cliente y,
# además, esta clave para cifrar los tokens de Google guardados en la BD. Vacía = interruptor desactivado.
# URI de redirección autorizada: <dirección pública>/worker/google-calendar/callback
crm.google-calendar.token-key=${GOOGLE_TOKEN_KEY:}

# --- Reservas: franja de las citas y horario por defecto de un centro nuevo (cada centro tiene el suyo, OpeningHoursService) ---
crm.booking.open-hour=9
crm.booking.close-hour=20
crm.booking.slot-minutes=30
# Horas que tiene el cliente para responder a una propuesta de otra hora (como mucho, hasta 2 h antes de la primera)
crm.booking.proposal-hours=48
crm.booking.working-days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY

# --- Recursos estáticos ---
# Cada CSS/JS se sirve con un hash de su contenido en la URL (p. ej. common-3f2a….css):
# cuando cambia un fichero el navegador descarga la versión nueva, nunca una antigua de la caché.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# --- Subida de fotos (foto de presentación del centro; CenterPhotoService.MAX_UPLOAD_MB) ---
# El límite de Tomcat va por encima del de CenterPhotoService (8 MB): una foto de 8-20 MB recibe el aviso
# «Elige una más ligera». Si se pasara de aquí, la petición llegaría sin token CSRF y daría «Acceso denegado».
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
