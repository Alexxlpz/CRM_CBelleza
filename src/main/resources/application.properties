# --- Email Configuration (SMTP) ---
# Default empty host activates local console simulation fallback.
# Provide environment variables (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD) for real email delivery.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cuquora Contact & Registration Mail Settings
crm.mail.admin-email=${CRM_ADMIN_EMAIL:cuquora@hotmail.com}
crm.mail.from-email=${CRM_FROM_EMAIL:cuquora@hotmail.com}

