spring.application.name=CRM_CBelleza

# Thymeleaf configuration (disable cache for development)
spring.thymeleaf.cache=false

# SQL Database Configuration
# Defaults to H2 for local development; Docker Compose overrides these values for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:crm_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# --- Alternative MySQL Configuration (Uncomment to use) ---
