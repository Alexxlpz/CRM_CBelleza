# Perfil de desarrollo: activar con spring.profiles.active=dev
# (en IntelliJ: Run Configuration > Active profiles = dev)
#  - Habilita el selector de perfiles /login-selector (entrar como cualquier usuario sin contraseña)
#  - Habilita la consola H2 en /h2-console
#  - Muestra el SQL generado en la consola
#  - Carga los datos de demostración (centros y cuentas con contraseña Cuquora2026!)
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Recalcula el hash de CSS/JS en cada petición para ver los cambios sin reiniciar
spring.web.resources.chain.cache=false
# Recarga las plantillas Thymeleaf en cada petición (en producción se cachean)
spring.thymeleaf.cache=false
# Datos de demostración (DatabaseSeeder)
crm.seed-demo-data=true
# Visitas y ventas pasadas en Centro Histórico desde enero del año anterior, para la pantalla «Análisis» (DemoHistory)
crm.seed-demo-history=true
# BD en memoria que se borra al reiniciar (sin DB_CLOSE_DELAY=-1): cuando devtools reinicia la app tras compilar,
# la BD anterior seguía viva con las restricciones atadas a la conexión cerrada y los UPDATE de citas fallaban con
# «Check constraint invalid: CK_APPOINTMENTS_STATUS» (causa: «La base de datos ha sido cerrada»).
spring.datasource.url=${DB_URL:jdbc:h2:mem:crm_db;DB_CLOSE_ON_EXIT=FALSE}
# Lee los secretos del .env de la raíz (Google, correo…) al arrancar desde IntelliJ o mvn; docker compose ya lo lee solo.
# Solo en dev, para que los tests nunca usen credenciales reales. Sin .env la app arranca igual (sin Google).
spring.config.import=optional:file:.env[.properties]
# El .env trae el SMTP de Brevo: en dev los correos se escriben en consola para no escribir a los correos de los
# clientes demo (los recordatorios salen solos cada minuto). Para probar un envío real: DEV_MAIL_HOST=smtp-relay.brevo.com
spring.mail.host=${DEV_MAIL_HOST:}
