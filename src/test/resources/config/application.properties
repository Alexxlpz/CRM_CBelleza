 # Configuración extra para los tests (Spring Boot la suma a src/main/resources/application.properties).
# Los tests usan los centros y cuentas de DatabaseSeeder (ver TestUsers).

# Base de datos de los tests: PostgreSQL 16 en Docker (Testcontainers), la misma versión que producción. Con H2 se
# colaban fallos que solo da PostgreSQL (p. ej. el INSERT dentro de una consulta de solo lectura del centro nuevo).
# Necesita Docker abierto (Docker Desktop en Windows). El contenedor se arranca una vez por ejecución y lo comparten
# todos los tests (TC_DAEMON=true: sigue vivo entre contextos de Spring) y se borra solo al terminar.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///cuquora_test?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
crm.seed-demo-data=true
# Los tests envían muchos formularios públicos desde la misma IP: el freno por IP (PublicFormLimiter) se prueba aparte
crm.security.form-limits.contact=1000
crm.security.form-limits.center-registration=1000
crm.security.form-limits.registration=1000
crm.security.form-limits.password-reset=1000

# Administración (AdminAccess): fijo en los tests para no depender del .env
crm.mail.admin-email=admin@cuquora.test
